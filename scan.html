<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e8eef7;padding:12px 12px 74px}
  h1{font-size:18px;margin:2px 0 10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card{background:#16223a;border:1px solid #24365a;border-radius:16px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12.5px;color:#9fb3d1;margin:9px 0 4px}
  input,select{width:100%;padding:12px;border-radius:11px;border:1px solid #2c3f66;background:#0e1930;color:#fff;font-size:16px;outline:none}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#fff;margin-top:12px}
  .btn.primary{background:linear-gradient(135deg,#10b981,#059669)}
  .btn.blue{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
  .btn:disabled{opacity:.5}
  .wrapcam{position:relative;border-radius:12px;overflow:hidden;background:#000;min-height:240px;display:flex;align-items:center;justify-content:center}
  #cam{width:100%;height:auto;max-height:56vh;object-fit:contain;background:#000;display:none}
  .ph{color:#6d84a8;font-size:13px;text-align:center;padding:30px;line-height:1.7}
  .scanline{position:absolute;left:8%;right:8%;height:2px;background:#22d3ee;box-shadow:0 0 12px #22d3ee;top:20%;animation:sc 2s linear infinite}
  @keyframes sc{0%{top:15%}50%{top:82%}100%{top:15%}}
  .tag{display:inline-block;background:#22314f;color:#9fd0ff;font-size:11.5px;padding:3px 9px;border-radius:20px}
  .hint{font-size:12px;color:#7f95b8;line-height:1.8;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0b1426;border:1px solid #2c3f66;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.3s;max-width:92%;text-align:center;z-index:9}
  .toast.show{opacity:1}
  .ok{color:#34d399}.err{color:#f87171}
  .sec{font-size:12px;color:#7f95b8;margin:14px 0 2px;border-top:1px solid #24365a;padding-top:10px;display:flex;justify-content:space-between;align-items:center}
  .sw{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfe0f7}
  .sw input{width:auto}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#0b1426;border-top:1px solid #24365a;display:flex;justify-content:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .bar a{flex:1;max-width:200px;text-align:center;text-decoration:none;color:#cfe0f7;font-size:12.5px;padding:9px 0;border-radius:10px;background:#16223a}
  .log{font-size:12px;color:#7f95b8;margin-top:8px;max-height:78px;overflow:auto;line-height:1.7}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#reader canvas.drawingBuffer{display:none}

<body>
  <h1>📷 扫码入库 <span class="tag" style="background:#7c3aed;color:#fff">v9-14f</span> <span id="netTag" class="tag"></span> <span id="syncTick" class="tag" style="background:#182738;color:#9fb3d1"></span> <span class="tag" style="background:#1f3a5f;color:#cfe4ff;cursor:pointer" onclick="csyncLoginUI()" title="云端开了权限保护后需要登录">☁️ 登录云端</span></h1>

  <div class="card">
    <div id="reader" style="width:100%;height:220px;border-radius:12px;overflow:hidden;background:#000;position:relative"></div>
    <div class="ph" id="camPh" style="font-size:12px;color:#6d84a8;text-align:center;padding:8px">点下方「开启摄像头」扫描条码</div>
    <button class="btn blue" id="camBtn" onclick="toggleCam()">🎥 开启摄像头</button>
    <input type="file" id="photoInp" accept="image/*" capture="environment" style="display:none" onchange="decodePhoto(this)">
    <button class="btn" style="background:#0ea5e9;color:#fff" onclick="document.getElementById('photoInp').click()">📸 拍照识别（一定能用，推荐）</button>
    <div class="sec"><span>操作类型</span><span><label class="sw"><input type="radio" name="smode" value="in" checked onchange="setMode()"> 入库</label>　<label class="sw"><input type="radio" name="smode" value="out" onchange="setMode()"> 出库</label></span></div>

    <div class="hint" id="statusLine"></div>
    <div id="diagLine" class="hint" style="text-align:center"></div>
    <div id="scanInfo" class="hint" style="text-align:center"></div>
    <div class="log" id="logBox"></div>
  </div>

  <div class="card">
    <div class="ico" style="text-align:center;font-size:30px">🏷️</div>
    <div id="foundHint" class="hint" style="text-align:center"></div>
    <label>条形码</label>
    <input id="f_bc" placeholder="扫码 或 手动输入条形码" onchange="lookup()">
    <label>商品名称（自动带出，可修改）</label>
    <input id="f_name" placeholder="自动获取或手动填写">
    <label>品牌（下拉选 或 手动输入；新品牌自动创建）</label>
    <div style="display:flex;gap:8px">
      <select id="f_brandSel" onchange="pickSel('brand')" style="flex:0 0 46%"><option value="">选择已有…</option></select>
      <input id="f_brand" placeholder="或手动输入品牌" style="flex:1">
    </div>
    <div id="unitPickWrap" style="display:none"><label>入库单位（整箱/拆零）</label><select id="f_unitPick" onchange="onUnitPick()"></select><div id="qtyHint" class="hint"></div></div>
    <div id="attachWrap" style="display:none"><label>或：归入已有商品作为规格（同款白光/黄光）</label><select id="f_attach"></select><input id="f_varName" placeholder="规格名（如 白光 / 黄光）" style="margin-top:8px"></div>
    <label>类目（下拉选 或 手动输入）</label>
    <div style="display:flex;gap:8px">
      <select id="f_catSel" onchange="pickSel('cat')" style="flex:0 0 46%"><option value="">选择已有…</option></select>
      <input id="f_cat" placeholder="或手动输入类目" style="flex:1">
    </div>
    <div class="row">
      <div><label>数量</label><input id="f_qty" type="number" value="1" min="1" inputmode="numeric" oninput="if(typeof onUnitPick==='function')onUnitPick()"></div>
      <div><label>单位</label><select id="f_unit" onchange="onSetUnitScan()"><option value="个" selected>个</option><option value="对">对</option><option value="只">只</option><option value="双">双</option><option value="套">套</option><option value="副">副</option><option value="组">组</option><option value="件">件</option><option value="盒">盒</option><option value="箱">箱</option><option value="包">包</option><option value="袋">袋</option><option value="瓶">瓶</option><option value="桶">桶</option><option value="罐">罐</option><option value="条">条</option><option value="支">支</option><option value="把">把</option><option value="张">张</option><option value="片">片</option><option value="块">块</option><option value="台">台</option><option value="部">部</option><option value="米">米</option><option value="公斤">公斤</option><option value="斤">斤</option><option value="升">升</option></select></div>
    </div>
    <div class="field" id="pairWrap" style="display:none"><label>成对 / 单个（单位选 对/双/套/副/组 时填）</label><div class="row"><div><label>每对=多少只</label><input id="s_pairFactor" type="number" value="2" oninput="syncScanPrice();syncScanQty()"></div><div><label>成对数量</label><input id="s_pqty" type="number" oninput="syncScanQty()"></div><div><label>单个数量</label><input id="s_oqty" readonly placeholder="自动"></div></div><div class="row"><div><label>成对成本¥</label><input id="s_pcost" type="number" step="0.01" oninput="syncScanPrice()"></div><div><label>成对售价¥</label><input id="s_pprice" type="number" step="0.01" oninput="syncScanPrice()"></div></div><div class="row"><div><label>单个成本¥</label><input id="s_ocost" type="number" step="0.01"></div><div><label>单个售价¥</label><input id="s_oprice" type="number" step="0.01"></div></div></div>
    <div class="row">
      <div><label>成本价(可选)</label><input id="f_cost" type="number" step="0.01" inputmode="decimal"></div>
      <div><label>售价(可选)</label><input id="f_price" type="number" step="0.01" inputmode="decimal"></div>
    </div>
    <button class="btn primary" id="subBtn" onclick="submitScan()">✅ 入库（同步到库存）</button>
    <div class="hint">手动/蓝牙扫码枪：在"条形码"框输入后回车即可（会自动带出商品信息）。</div>
  </div>

  <div class="bar"><a href="index.html">🏠 首页</a><a href="app.html">📱 打开软件</a></div>
  <div class="toast" id="toast"></div>


<script src="quagga2.min.js"></script>
<script src="zxing.min.js"></script>
<script>
const API = location.origin;
/* 访问口令：手机通过 8443/隧道 打开时，地址里的 ?k=口令 会自动带到接口 */
function apiTok(){ try{ var m=location.search.match(/[?&]k=([^&]+)/); if(m){ var t=decodeURIComponent(m[1]); localStorage.setItem("honghuTok",t); return t; } return localStorage.getItem("honghuTok")||""; }catch(e){ return ""; } }
const HHTOK=apiTok();
function apiUrl(p){ if(!HHTOK)return API+p; return API+p+(p.indexOf("?")>=0?"&":"?")+"k="+encodeURIComponent(HHTOK); }
const CLOUD_URL='https://jzclolmbxdtmfrylrifr.supabase.co';
const CLOUD_KEY='sb_publishable_DlerdBhrH7ulJPcW2Zj6Rg_QmsH15o2';
const CLOUD_TABLE='app_data';
let DBcache=null, stream=null, detector=null, scanTimer=null, running=false, online=false;
let continuous=false, lastCode="", lastTime=0;

function toast(m){const t=document.getElementById("toast");t.innerHTML=m;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2600);}
function logLine(m){const b=document.getElementById("logBox");const d=document.createElement("div");d.innerHTML=m;b.insertBefore(d,b.firstChild);if(b.childNodes.length>20)b.removeChild(b.lastChild);}
function setTag(){const t=document.getElementById("netTag");t.textContent=online?"已连本机":"云端直连";t.style.background=online?"#1b3a2a":"#3a2f1b";t.style.color=online?"#86efac":"#fcd34d";}
function syncTick(t){const el=document.getElementById("syncTick");if(el)el.textContent=(t||"已同步")+" "+new Date().toTimeString().slice(0,8);}

/* 云端同步账号（云端开 RLS 后要用；没配就还是用公开 key，向后兼容） */
function csyncEmail(){ try{return localStorage.getItem("honghuSyncEmail")||"";}catch(e){return "";} }
function csyncPass(){ try{return localStorage.getItem("honghuSyncPass")||"";}catch(e){return "";} }
const _CLOUD_BH='Bea'+'rer ';   /* 云端授权头前缀 */
let _cjwt=null,_cjwtExp=0,_tok=null;
async function cloudAuth(){
  try{
    if(_cjwt&&Date.now()<_cjwtExp-60000)return _cjwt;
    const em=csyncEmail(),pw=csyncPass(); if(!em||!pw)return null;
    const r=await fetch(CLOUD_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CLOUD_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})});
    if(!r.ok)return null;
    const j=await r.json(); if(!j||!j.access_token)return null;
    _cjwt=j.access_token; _tok=_cjwt; _cjwtExp=Date.now()+((+j.expires_in||3600)*1000); return _cjwt;
  }catch(e){ return null; }
}
async function csyncLoginUI(){
  try{
    var em=prompt("云端同步账号（邮箱）", csyncEmail()||""); if(em==null)return;
    var pw=prompt("云端同步密码", ""); if(pw==null)return;
    localStorage.setItem("honghuSyncEmail",em.trim()); localStorage.setItem("honghuSyncPass",pw); _cjwt=null;
    var t=await cloudAuth();
    alert(t?"云端账号已登录":"登录失败：账号或密码不对，或邮箱未验证");
  }catch(e){}
}
async function cloudGet(){try{const _at=await cloudAuth();const r=await fetch(CLOUD_URL+'/rest/v1/'+CLOUD_TABLE+'?select=data&id=eq.main',{headers:{apikey:CLOUD_KEY,Authorization:_CLOUD_BH+(_tok||CLOUD_KEY)}});const rows=await r.json();return (rows&&rows[0]&&rows[0].data)||null;}catch(e){return null;}}
async function cloudPut(db){try{await cloudAuth();}catch(e){}const h={apikey:CLOUD_KEY,Authorization:_CLOUD_BH+(_tok||CLOUD_KEY),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'};const r=await fetch(CLOUD_URL+'/rest/v1/'+CLOUD_TABLE,{method:'POST',headers:h,body:JSON.stringify({id:'main',data:db,updated_at:new Date().toISOString()})});return r.ok;}
function mergeInto(db,j){
  var _sign=(String(j.mode||"in")==="out")?-1:1;
  db.products=db.products||[];db.brands=db.brands||[];db.cats=db.cats||[];
  const bc=(j.barcode||"").trim(),nm=(j.name||"").trim(),br=(j.brand||"").trim(),ca=(j.category||"").trim();
  let qty=(+j.qty||0)*_sign;if(qty===0)qty=_sign;
  let prod=null;
  if(bc){prod=db.products.find(p=>(p.barcode||"")===bc);}
  if(!prod&&nm){prod=db.products.find(p=>(p.name||"")===nm);}
  let resultName,resultStock;
  if(prod){prod.stock=(+prod.stock||0)+qty;if(nm)prod.name=nm;if(br)prod.brand=br;if(ca)prod.category=ca;if(bc)prod.barcode=bc;if(+j.cost>0)prod.cost=+j.cost;if(+j.price>0)prod.price=+j.price;resultName=prod.name;resultStock=prod.stock;}
  else{const name=nm||(bc?('未命名('+bc+')'):'扫码商品');prod={id:('s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),sku:bc,barcode:bc,name:name,brand:br,category:ca,cost:+j.cost||0,price:+j.price||0,stock:qty,minStock:0,location:'',unit:j.unit||'个'};db.products.push(prod);resultName=name;resultStock=qty;}
  if(br&&db.brands.indexOf(br)<0)db.brands.push(br);
  if(ca&&db.cats.indexOf(ca)<0)db.cats.push(ca);
  db.savedAt=Date.now();
  return {name:resultName,stock:resultStock};
}

function fillLists(d){
  var cats=(d&&d.cats&&d.cats.length)?d.cats:["外观件","灯光","性能","内饰","排气","轮毂","悬挂","电子","其他"];
  var brands=d?[...new Set([...(d.brands||[]),...(d.products||[]).map(function(p){return p.brand;}).filter(Boolean)])]:[];
  var cs=document.getElementById("f_catSel");
  if(cs){var cv=cs.value;cs.innerHTML='<option value="">选择已有类目…</option>'+cats.map(function(x){return '<option value="'+x+'">'+x+'</option>';}).join("");cs.value=cv;}
  var bs=document.getElementById("f_brandSel");
  if(bs){var bv=bs.value;bs.innerHTML='<option value="">选择已有品牌…</option>'+brands.map(function(x){return '<option value="'+x+'">'+x+'</option>';}).join("");bs.value=bv;}
}
async function loadData(){
  let d=null;
  try{const r=await fetch(apiUrl("/load"),{cache:"no-store"});if(r.ok){d=await r.json();online=!!(d&&d.products);}}catch(e){}
  if(!online){d=await cloudGet();}
  DBcache=d&&d.products?d:null;setTag();fillLists(DBcache);
}
async function refreshData(){
  let d=null;
  try{const r=await fetch(apiUrl("/load"),{cache:"no-store"});if(r.ok){d=await r.json();online=!!(d&&d.products);}}catch(e){}
  if(!online){d=await cloudGet();}
  if(!d||!d.products){syncTick("离线");return;}
  DBcache=d;setTag();fillLists(d);lookup();syncTick();
}

function setupUnitPick(p){
  var sel=document.getElementById("f_unitPick"),wrap=document.getElementById("unitPickWrap");
  if(!sel||!wrap)return;
  if(p&&p.units&&p.units.length){
    var base=(p.unit||"个");
    sel.innerHTML='<option value="1">'+base+'（基础单位）</option>'+p.units.map(function(u){return '<option value="'+u.factor+'">'+u.name+'（1'+u.name+'='+u.factor+base+'）</option>';}).join("");
    sel.value="1";wrap.style.display="";onUnitPick();
  }else{wrap.style.display="none";var h=document.getElementById("qtyHint");if(h)h.textContent="";}
}
function onSetUnitScan(){try{var u=(document.getElementById("f_unit")||{}).value||"";var w=document.getElementById("pairWrap");if(w)w.style.display=(["对","双","套","副","组"].indexOf(u)>=0)?"":"none";}catch(e){}}
function syncScanPrice(){try{var f=+((document.getElementById("s_pairFactor")||{}).value||2)||2;var pc=document.getElementById("s_pcost"),pp=document.getElementById("s_pprice");var oc=document.getElementById("s_ocost"),op=document.getElementById("s_oprice");if(pc&&oc&&pc.value!=="")oc.value=(+((+pc.value)/f).toFixed(2));if(pp&&op&&pp.value!=="")op.value=(+((+pp.value)/f).toFixed(2));}catch(e){}}
function syncScanQty(){try{var f=+((document.getElementById("s_pairFactor")||{}).value||2)||2;var pq=document.getElementById("s_pqty"),oq=document.getElementById("s_oqty");if(pq&&oq&&pq.value!=="")oq.value=(+pq.value*f);}catch(e){}}
function onUnitPick(){
  var sel=document.getElementById("f_unitPick");var f=sel?+sel.value||1:1;
  var q=+document.getElementById("f_qty").value||0;var h=document.getElementById("qtyHint");
  if(h)h.textContent=(f>1?("本次入库 = "+q*f+" 个（基础单位）"):"");
}
function pickSel(which){try{if(which==="brand"){var s=document.getElementById("f_brandSel");if(s&&s.value)document.getElementById("f_brand").value=s.value;}else{var s2=document.getElementById("f_catSel");if(s2&&s2.value)document.getElementById("f_cat").value=s2.value;}}catch(e){}}
function fillAttach(){var s=document.getElementById("f_attach");if(!s||!DBcache)return;s.innerHTML='<option value="">不归入，作为新商品</option>'+DBcache.products.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("");}
function lookup(){
  const bc=document.getElementById("f_bc").value.trim();
  const nm=document.getElementById("f_name").value.trim();
  const hint=document.getElementById("foundHint");
  if(!DBcache){if(hint)hint.innerHTML="";return null;}
  let p=null;
  if(bc)p=DBcache.products.find(x=>String(x.barcode||"").trim()===bc||((x.variants||[]).some(function(v){return String(v.barcode||"").trim()===bc;})));
  if(!p&&nm)p=DBcache.products.find(x=>String(x.name||"").trim()===nm);
  if(p){
    const fn=document.getElementById("f_name"),fb=document.getElementById("f_brand"),fc=document.getElementById("f_cat");
    if(!fn.value)fn.value=p.name||"";
    if(!fb.value)fb.value=p.brand||"";
    if(!fc.value&&p.category)fc.value=p.category;
    if(p.cost&&!document.getElementById("f_cost").value)document.getElementById("f_cost").value=p.cost;
    if(p.price&&!document.getElementById("f_price").value)document.getElementById("f_price").value=p.price;
    if(p.unit)document.getElementById("f_unit").value=p.unit;
    var _vm="";(p.variants||[]).forEach(function(v){if(String(v.barcode||"").trim()===bc)_vm=v.name;});
    if(hint)hint.innerHTML='<div style="background:#10321f;border:1px solid #1c5a37;border-radius:10px;padding:9px 11px;margin-bottom:6px;color:#86efac">✅ 码库已有：<b>'+(p.name||"")+'</b>'+(_vm?('（规格：'+_vm+'）'):'')+'（库存 '+p.stock+'）· 本次入库将累加</div>';
    if(typeof setupUnitPick==="function")setupUnitPick(p);
    try{document.getElementById("attachWrap").style.display="none";}catch(e){}
  } else if(bc||nm){
    if(hint)hint.innerHTML='<div style="background:#33260e;border:1px solid #6b4e14;border-radius:10px;padding:9px 11px;margin-bottom:6px;color:#fcd34d">🆕 新条码（码库还没有）：填名称/品牌/类目/数量再入库；<b>若它是某款已有的另一个规格（如白光/黄光），请在下面「归入已有商品」里选那款、填规格名</b>，就会并到同一商品下。</div>';
    try{document.getElementById("attachWrap").style.display="";fillAttach();}catch(e){}
  } else { if(hint)hint.innerHTML=""; }
  return p;
}
function useCode(code){
  code=String(code||"").trim();if(!code)return;
  document.getElementById("f_bc").value=code;
  document.getElementById("f_name").value="";
  document.getElementById("f_brand").value="";
  document.getElementById("f_cat").value="";
  document.getElementById("f_cost").value="";
  document.getElementById("f_price").value="";
  if("vibrate" in navigator)navigator.vibrate(60);
  const p=lookup();
  if(p){

let frameCount=0, zxReader=null, camRunning=false;

var _ac=null;
function beep(){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==="suspended"){_ac.resume();}var o=_ac.createOscillator(),g=_ac.createGain();o.connect(g);g.connect(_ac.destination);o.type="sine";o.frequency.value=930;g.gain.value=0.18;o.start();setTimeout(function(){try{o.stop();}catch(e){}},150);}catch(e){}}
function handleCode(v){v=String(v||"").trim();if(!v)return;const now=Date.now();if(v===lastCode&&now-lastTime<3500)return;lastCode=v;lastTime=now;try{beep();}catch(e){} if("vibrate" in navigator)navigator.vibrate([90,40,90]); try{toast("✅ 已识别："+v);}catch(e){} useCode(v);

let frameTimer=null,_busy=false,_reader=null;
var _codeHist=[];
function _confirmCode(t){ if(!t)return false; _codeHist.push(t); if(_codeHist.length>4)_codeHist.shift(); var n=0; for(var i=0;i<_codeHist.length;i++){ if(_codeHist[i]===t)n++; } return n>=2; }
function startFrameScan(){
  if(!window.ZXing){return;}
  if(!_reader){try{
    var _H=new Map();
    try{_H.set(ZXing.DecodeHintType.TRY_HARDER,true);}catch(e){}
    try{_H.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.QR_CODE]);}catch(e){}
    _reader=new ZXing.BrowserMultiFormatReader(_H);
  }catch(e){try{_reader=new ZXing.BrowserMultiFormatReader();}catch(e2){return;}}}
  if(frameTimer){clearInterval(frameTimer);frameTimer=null;}
  frameTimer=setInterval(function(){
    if(!camRunning||_busy){return;}
    var v=document.querySelector("#reader video")||document.getElementById("cam");
    if(!v||!v.videoWidth){return;}
    _busy=true;
    try{
      var cv=document.createElement("canvas");
      var w=v.videoWidth,h=v.videoHeight,mx=1280;
      if(w>mx){h=Math.round(h*mx/w);w=mx;}
      cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(v,0,0,w,h);
      var url=cv.toDataURL("image/jpeg",0.85);
      _reader.decodeFromImageUrl(url).then(function(res){
        _busy=false;frameCount++;
        var si=document.getElementById("scanInfo");if(si)si.textContent="已抓帧 "+frameCount+" 次 · 识别中…";
        if(res){var _t=String(res.getText()||"").trim();if(_confirmCode(_t)){handleCode(_t);}else{try{var _si=document.getElementById("scanInfo");if(_si)_si.textContent="已抓帧 "+frameCount+" 次 · 再稳一下确认 "+_t;}catch(e){}}}
      }).catch(function(){
        _busy=false;frameCount++;
        var si=document.getElementById("scanInfo");if(si)si.textContent="已抓帧 "+frameCount+" 次 · 识别中…";
      });
    }catch(e){_busy=false;}
  },500);
}
function decodePhoto(inp){
  var f=inp.files&&inp.files[0]; if(!f){return;}
  if(!window.ZXing){ toast("识别库未加载，请刷新页面"); inp.value=""; return; }
  updateStatus("正在识别照片…");
  var url=URL.createObjectURL(f);
  var r=new ZXing.BrowserMultiFormatReader();
  r.decodeFromImageUrl(url).then(function(res){
    try{URL.revokeObjectURL(url);}catch(e){}
    var txt=res&&(res.getText?res.getText():res.text);
    if(txt){ handleCode(txt); toast("✅ 已识别："+txt); }
    else { updateStatus("未识别到条码"); toast("没认出来，再拍一张（对准、清晰点）"); }
  }).catch(function(){
    try{URL.revokeObjectURL(url);}catch(e){}
    updateStatus("未识别到条码"); toast("没认出来，再拍一张（对准、清晰点）");
  });
  inp.value="";
}

function toggleCam(){
  if(camRunning){ stopCam(); return; }
  if(!window.Quagga){ toast("识别库未加载，请刷新页面"); return; }
  document.getElementById("camBtn").textContent="⏹ 停止";

  var ph=document.getElementById("camPh"); if(ph)ph.style.display="none";
  var sl=document.getElementById("scanline"); if(sl)sl.style.display="block";
  try{
    Quagga.init({
      inputStream:{ type:"LiveStream", target:document.querySelector("#reader"), constraints:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} } },
      locator:{ patchSize:"medium", halfSample:true },
      numOfWorkers:0,
      frequency:10,
      decoder:{ readers:["ean_reader","ean_8_reader","code_128_reader","code_39_reader","code_93_reader","upc_reader","upc_e_reader","codabar_reader","i2of5_reader"], multiple:false },
      locate:true
    }, function(err){
      if(err){ camRunning=false; document.getElementById("camBtn").textContent="🎥 开启摄像头"; updateStatus(""); toast("无法打开摄像头："+((err&&(err.message||err))||err)); return; }
      try{ Quagga.start(); }catch(e){}
      camRunning=true;
      startFrameScan();
      updateStatus("摄像头已开启，请对准商品条码…");
      lastTime=Date.now();
      setTimeout(function(){try{if(camRunning&&(Date.now()-lastTime)>7500)updateStatus("还没识别到？把条码放近占满取景框、对准、别抖动、光线足一点");}catch(e){}},8000);
    });
    if(!window._qHooked){
      window._qHooked=true;
      Quagga.onDetected(function(result){
        try{
          var code=result&&result.codeResult&&result.codeResult.code;
          frameCount++;
          var si=document.getElementById("scanInfo"); if(si)si.textContent="已识别 "+frameCount+" 次…";
          if(code) handleCode(code);
        }catch(e){}
      });
    }
  }catch(e){ camRunning=false; document.getElementById("camBtn").textContent="🎥 开启摄像头"; toast("无法打开摄像头："+e.message); }
}
