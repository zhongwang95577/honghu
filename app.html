<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸿鹄对账软件</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{
  --bg:#eef2f7;--bg-2:#f1f5f9;--panel:#ffffff;--panel-2:#fbfcfe;
  --card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --accent:#4f46e5;--accent-2:#0ea5e9;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--violet:#8b5cf6;
  --shadow:0 12px 34px rgba(15,23,42,.09);--radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(160deg,#f8fafc 0%,#eef2f7 55%,#e7edf6 100%);
  color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
.wrap{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:230px;flex-shrink:0;padding:22px 16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#ffffff,#fbfcfe);border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#6366f1,#0ea5e9);box-shadow:0 8px 22px rgba(99,102,241,.35)}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px;color:var(--text)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#586078;cursor:pointer;transition:.22s;font-size:14px;font-weight:600;text-decoration:none;position:relative}
.nav a .ic{font-size:18px;width:22px;text-align:center}
.nav a:hover{background:#eef2f7;color:var(--text);transform:translateX(3px)}
.nav a.active{background:linear-gradient(135deg,#eef0ff,#e6f7ff);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(99,102,241,.18)}
.nav a.active::before{content:"";position:absolute;left:-16px;top:20%;bottom:20%;width:4px;border-radius:4px;background:linear-gradient(#6366f1,#0ea5e9)}
.side-foot{margin-top:auto;padding:12px 10px;font-size:12px;color:var(--muted);background:#f1f5f9;border:1px solid var(--border);border-radius:12px;line-height:1.7}
.side-foot b{color:var(--text);font-size:12px}
.main{flex:1;padding:8px 8px 40px;max-width:1280px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;gap:14px;flex-wrap:wrap}
.topbar .t-left h2{font-size:24px;font-weight:800;letter-spacing:.3px;color:var(--text)}
.topbar .t-left p{color:var(--muted);font-size:13px;margin-top:5px}
.topbar .t-left p b{color:var(--accent)}
.btn{cursor:pointer;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:.22s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;box-shadow:0 10px 24px rgba(99,102,241,.34)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(99,102,241,.44)}
.btn-ghost{background:#ffffff;color:var(--text);border:1px solid var(--border);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.btn-ghost:hover{background:#f1f5f9}
.btn-danger{background:#fee2e2;color:#b91c1c}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:#ffffff;border:1px solid var(--border);color:#64748b;transition:.2s}
.icon-btn:hover{color:var(--text);background:#f1f5f9}
.icon-btn.edit:hover{color:var(--accent)}
.page{animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h3.sec{font-size:17px;font-weight:800;margin:26px 26px 0;display:flex;align-items:center;gap:10px;color:var(--text)}
h3.sec .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(#6366f1,#0ea5e9)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.badge.blue{background:#eef2ff;color:#4338ca}
.badge.green{background:#ecfdf5;color:#047857}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.amber{background:#fef3c7;color:#b45309}
.grid{display:grid;gap:16px;padding:20px 26px}
.g-4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;transition:.3s;box-shadow:var(--shadow)}
.kpi:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.12)}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .val{font-size:27px;font-weight:800;margin-top:12px;letter-spacing:.3px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .sub{font-size:12px;margin-top:6px;color:var(--muted)}
.kpi .glow{position:absolute;top:-30px;right:-30px;width:110px;height:110px;border-radius:50%;opacity:.16;filter:blur(8px)}
.kpi.bl{--c:var(--accent)}.kpi.gr{--c:var(--green)}.kpi.rd{--c:var(--red)}.kpi.am{--c:var(--amber)}.kpi.cy{--c:var(--accent-2)}
.kpi.bl .glow,.kpi.gr .glow,.kpi.rd .glow,.kpi.am .glow,.kpi.cy .glow{background:var(--c)}
.kpi .up{color:var(--green);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:.3s;box-shadow:var(--shadow)}
.card:hover{box-shadow:0 18px 40px rgba(15,23,42,.10)}
.card h4{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--text)}
.table-wrap{padding:0 26px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 14px;font-size:13.5px;border-bottom:1px solid #eef2f7;vertical-align:middle;color:var(--text)}
tbody tr{transition:.15s}
tbody tr:hover{background:#f8fafc}
.table-actions{display:flex;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pchip .em{font-size:14px}
.acct{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:.3s;position:relative;box-shadow:var(--shadow)}
.acct:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.10)}
.acct .head{display:flex;align-items:center;gap:12px}
.acct .av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.acct .name{font-weight:800;font-size:15px;color:var(--text)}
.acct .holder{font-size:12px;color:var(--muted);margin-top:2px}
.acct .meta{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.9}
.acct .sum{margin-top:6px;font-size:14px;font-weight:800;color:var(--green)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:42px;opacity:.6;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty p{font-size:14px}
.bar{height:9px;border-radius:10px;background:#e8eef6;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#6366f1,#0ea5e9);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar.warn>span{background:linear-gradient(90deg,var(--amber),var(--red))}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
.overlay.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:22px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(15,23,42,.20);animation:rise .4s cubic-bezier(.22,1,.36,1)}
.modal.wide{max-width:640px}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;border-radius:22px 22px 0 0}
.modal-head h3{font-size:17px;display:flex;align-items:center;gap:9px;color:var(--text)}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:#ffffff;color:var(--text);font-size:14px;transition:.2s;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
.field .row{display:flex;gap:10px}
.field .row>*{flex:1}
.field textarea{resize:vertical;min-height:70px}
.req::after{content:" *";color:var(--red)}
#toasts{position:fixed;top:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:#ffffff;border:1px solid var(--border);border-left:4px solid var(--green);color:var(--text);padding:14px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);min-width:240px;animation:slideIn .4s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;gap:10px}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--amber)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:slideOut .4s ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:18px 26px 0}
.tab{padding:8px 15px;border-radius:10px;background:#eef2f7;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;border:1px solid transparent;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:transparent}
.ln{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 26px;margin-top:6px}
.filterbar select,.filterbar input{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:#ffffff;color:var(--text);font-size:13px;outline:none}
.chart-legend{display:flex;flex-direction:column;gap:12px;width:100%}
.leg-row{display:flex;align-items:center;gap:10px;font-size:13px}
.leg-row .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.leg-row .nm{flex:1;color:var(--text);font-weight:600}
.leg-row .pct{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.status-sel{padding:5px 8px;border-radius:8px;background:#ffffff;color:var(--text);border:1px solid var(--border);font-size:12px;outline:none;cursor:pointer}
.status-sel:focus{border-color:var(--accent)}
@media(max-width:820px){
  .wrap{flex-direction:column}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto;border-right:0;border-top:1px solid var(--border);z-index:80;background:#fff}
  .brand{display:none}
  .nav{flex-direction:row;gap:2px;margin:0;width:100%}
  .nav a{flex-direction:column;gap:2px;padding:7px 10px;font-size:10px;min-width:60px;border-radius:10px;white-space:nowrap}
  .nav a .ic{width:auto;font-size:18px}
  .nav a:hover{transform:none}
  .side-foot{display:none}
  .main{padding:6px 6px 86px;max-width:100%;margin:0}
  .topbar{padding:14px 14px 6px;gap:10px}
  .topbar .t-left h2{font-size:19px}
  .topbar .t-left p{font-size:12px}
  .filterbar{padding:0 14px;margin-top:4px;gap:8px}
  .filterbar select,.filterbar input{padding:9px 10px;font-size:13px}
  .grid{gap:12px;padding:14px}
  .grid.g-kpi{grid-template-columns:1fr 1fr}
  .grid.g-2{grid-template-columns:1fr}
  h3.sec{margin-left:14px;font-size:15px}
  .table-wrap{padding-left:8px;padding-right:8px;overflow-x:auto}
  table{font-size:12px}
  th,td{padding:8px 9px;white-space:nowrap}
  .modal{width:100%!important;max-width:100%!important;border-radius:16px}
  .overlay{padding:10px}
  .btn{padding:11px 16px}
}
.reveal{opacity:0;transform:translateY(20px);transition:.6s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
.count{display:inline-block}
</style>
</head>

  <aside class="sidebar">

        var b2 = read();

      var bytes = [];

        if (c < 128) {

/* ================= KPI CALC ================= */
function platformTotals(platformId,accountId){
  let sale=0,order=0,exp=0,fees=0,cogs=0,refund=0,ship=0;
  const pAll=!platformId||platformId==="all";
  const aAll=!accountId||accountId==="all";
  DB.orders.forEach(o=>{
    if(!pAll&&o.platformId!==platformId)return;
    if(!aAll&&o.accountId!==accountId)return;
    if(!withinDate(o))return;
    if(!canSee(o.accountId))return;
    sale+=orderPaid(o);order++;fees+=orderFees(o);cogs+=orderCost(o);refund+=orderRefund(o);ship+=buyerShip(o);
  });
  DB.expenses.forEach(e=>{
    if(!pAll&&e.platformId!==platformId)return;
    if(!aAll&&e.accountId!==accountId)return;
    if(!withinDate(e))return;
    if(!canSee(e.accountId))return;
    exp+=e.amount;
  });
  const net=sale-fees-refund;
  const profit=net-cogs-exp;
  return {sale,order,exp,fees,cogs,refund,ship,net,profit};
}
function globalTotals(){
  let sale=0,order=0,exp=0,fees=0,cogs=0,refund=0,ship=0,stockV=0;
  DB.orders.forEach(o=>{if(!withinDate(o))return;if(!canSee(o.accountId))return;sale+=orderPaid(o);order++;fees+=orderFees(o);cogs+=orderCost(o);refund+=orderRefund(o);ship+=buyerShip(o);});
  DB.expenses.forEach(e=>{if(!withinDate(e))return;if(!canSee(e.accountId))return;exp+=e.amount;});
  DB.products.forEach(p=>{stockV+=p.stock*p.cost;});
  const net=sale-fees-refund;
  const profit=net-cogs-exp;
  return {sale,order,exp,fees,cogs,refund,ship,net,profit,stockV};
}

/* ================= COUNTER ANIMATION ================= */
function animateCount(el,target,format){
  const start=0,dur=900,startT=performance.now();
  const fmtFn=format==="money"?v=>yuan(v):v=>String(Math.round(v));
  function tick(t){
    const p=Math.min(1,(t-startT)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent=fmtFn(target*eased);
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function toggleRefund(){
  const st=$("#f_status")?$("#f_status").value:"";
  const box=document.getElementById("refund-box");
  const refundSt=REFUND_ST.includes(st);
  if(box)box.style.display=refundSt?"":"none";
  if(refundSt){
    const rd=$("#f_refundDate");if(rd&&!rd.value)rd.value=new Date().toISOString().slice(0,10);
    const ra=$("#f_refundAmount");
    if(ra&&(+ra.value===0)){const price=+($("#f_price").value||0),qty=+($("#f_qty").value||0);ra.value=price*qty;}
  }
  recalcOrder();
}
function quickStatus(id,status){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  const beforeEff=isRefund(o)?0:o.qty;
  if(REFUND_ST.includes(status)&&!o.refund)o.refund={date:new Date().toISOString().slice(0,10),amount:o.qty*o.price,reason:""};
  o.status=status;
  if(!REFUND_ST.includes(status)&&o.refund)o.refund.amount=0;
  const afterEff=isRefund(o)?0:o.qty;
  const delta=afterEff-beforeEff;
  const prod=DB.products.find(p=>p.id===o.productId);
  if(prod)prod.stock=Math.max(0,prod.stock-delta);
  save();render();toast(status==="已退款"||status==="已退货"?"已标记退款，库存已回补":"订单状态已更新");
}
function syncAcct(acctSelId,platSelId){
  const p=$("#"+platSelId).value;
  const opts=DB.accounts.filter(a=>a.platformId===p);
  const sel=document.getElementById(acctSelId);
  sel.innerHTML='<option value="">请选择账号</option>'+opts.map(a=>`<option value="${a.id}">${esc(a.name)}（${esc(a.holder)}）</option>`).join("");
  if(opts.length===1)sel.value=opts[0].id;
  autoRate(true);
}
function fillUnitSel(){
  var f=document.getElementById("unitField2"),s=document.getElementById("f_unitSel2");
  if(!f||!s)return;
  var pid=document.getElementById("f_prod")?document.getElementById("f_prod").value:"";
  var p=DB.products.find(function(x){return x.id===pid;});
  if(p&&p.units&&p.units.length){
    s.innerHTML='<option value="">'+esc(p.unit||"个")+'（基础）</option>'+p.units.map(function(u){return '<option value="'+esc(u.name)+'">'+esc(u.name)+'（1'+esc(u.name)+'='+u.factor+(p.unit||"个")+(u.price?("/¥"+u.price):"")+'）</option>';}).join("");
    f.style.display="";
  }else{f.style.display="none";s.innerHTML="";}
}
function onOrderUnit(){
  var s=document.getElementById("f_unitSel2");if(!s)return;
  var pid=document.getElementById("f_prod")?document.getElementById("f_prod").value:"";
  var p=DB.products.find(function(x){return x.id===pid;});if(!p)return;
  var un=s.value;
  if(un&&p.units){var uu=p.units.find(function(u){return u.name===un;});if(uu&&uu.price&&document.getElementById("f_price"))document.getElementById("f_price").value=uu.price;}
  else if(document.getElementById("f_price"))document.getElementById("f_price").value=p.price;
}
function orderUnitFactor(){
  var s=document.getElementById("f_unitSel2");if(!s||!s.value)return 1;
  var pid=document.getElementById("f_prod")?document.getElementById("f_prod").value:"";
  var p=DB.products.find(function(x){return x.id===pid;});if(!p||!p.units)return 1;
  var uu=p.units.find(function(u){return u.name===s.value;});return uu?(+uu.factor||1):1;

function recalcOrder(){
  const price=+$("#f_price").value||0,qty=+$("#f_qty").value||0;
  const gross=price*qty;
  const bship=+(document.getElementById("f_buyerShip")?document.getElementById("f_buyerShip").value:0)||0;
  const paid=gross+bship;
  const rate=+$("#f_commRate").value||0;
  const comm=Math.round(paid*rate/100*100)/100;
  const extraRate=+$("#f_extraRate").value||0;
  const extra=Math.round(paid*extraRate/100*100)/100;
  const ship=+$("#f_shipping").value||0, other=+$("#f_other").value||0;
  const refund=(document.getElementById("f_refundAmount")?+document.getElementById("f_refundAmount").value:0)||0;
  const fees=comm+extra+ship+other;const net=paid-refund-fees;
  const st=$("#f_status")?$("#f_status").value:"";
  const eff=REFUND_ST.includes(st)?0:qty;
  const prod=DB.products.find(p=>p.id===$("#f_prod").value);
  const ptypeEl=document.querySelector("input[name=ptype]:checked");const isTempForm=!!(ptypeEl&&ptypeEl.value==="temp");
  const tc=isTempForm?(+($("#f_tempCost")?$("#f_tempCost").value:0)||0):0;
  const cogs=isTempForm?tc*eff:(prod?prod.cost*eff:0);const profit=net-cogs;
  const set=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};
  set("f_gross",yuan(gross));set("f_bship",yuan(bship));set("f_paid",yuan(paid));
  set("f_comm","¥"+fmt(comm));set("f_extra","¥"+fmt(extra));set("f_ship",yuan(ship));set("f_otherd",yuan(other));
  set("f_refundd",yuan(refund));set("f_fees",yuan(fees));set("f_net",yuan(net));set("f_cogs",yuan(cogs));set("f_profit",yuan(profit));
}

function rmbUpper(n){
  n=Math.round((+n||0)*100)/100;
  if(n===0)return "零元整";
  const dig="零壹贰叁肆伍陆柒捌玖",un=["","拾","佰","仟"],bu=["","万","亿","万亿"];
  const neg=n<0;n=Math.abs(n);
  let ip=Math.floor(n),dp=Math.round((n-ip)*100),s="";
  if(ip===0){s="零";}else{let gi=0;
    while(ip>0){let g=ip%10000,gs="",pos=0,nz=false;
      while(g>0){const d=g%10;if(d===0){if(gs&&!nz){gs="零"+gs;}nz=true;}else{gs=dig[d]+un[pos]+gs;nz=false;}g=Math.floor(g/10);pos++;}
      if(gs)s=gs+bu[gi]+s;ip=Math.floor(ip/10000);gi++;}
  }
  s=s.replace(/零+/g,"零").replace(/零$/,"");
  let r=s+"元";
  if(dp===0){r+="整";}else{const j=Math.floor(dp/10),f=dp%10;if(j>0)r+=dig[j]+"角";if(f>0){if(j===0)r+="零";r+=dig[f]+"分";}}
  return (neg?"负":"")+r;
}

function matchRate(platformId,category){
  if(!platformId)return null;
  const rs=DB.rates.filter(r=>r.platformId===platformId);
  return rs.find(r=>r.category===category)||rs.find(r=>!r.category)||null;
}
function autoRate(apply){
  const p=$("#f_prod")?$("#f_prod").value:"";
  const prod=DB.products.find(x=>x.id===p);
  const cat=prod?prod.category:"";
  const r=matchRate($("#f_p")?$("#f_p").value:"",cat);
  const hint=document.getElementById("f_rateHint");
  const rateEl=$("#f_commRate");
  const extraHint=document.getElementById("f_extraHint");
  const extraEl=$("#f_extraRate");
  if(hint)hint.textContent=r?("⚡ 自动识别："+(r.tag||(cat||"默认"))+" 平台扣点 "+r.rate+"%"):"⚡ 未匹配规则，可到“扣点规则”设置";
  if(extraHint)extraHint.textContent=r&&+r.extraRate>0?("⚡ "+(r.extraTag||"无忧卖")+" "+r.extraRate+"%"):"";
  if(apply&&prod&&r&&rateEl)rateEl.value=r.rate;
  if(apply&&prod&&r&&extraEl&&+r.extraRate>0)extraEl.value=r.extraRate;
  recalcOrder();
}

function vProfit(){

  DB.orders.forEach(o=>{if(!withinDate(o))return;const p=DB.products.find(x=>x.id===o.productId);const name=p?p.name:"未知",cat=p?p.category:"—";const m=prodMap[o.productId]=prodMap[o.productId]||{name,cat,vol:0,sale:0,fees:0,refund:0,cost:0};m.vol+=effQty(o);m.sale+=orderGross(o);m.fees+=orderFees(o);m.refund+=orderRefund(o);m.cost+=orderCost(o);});
  const prodRows=Object.values(prodMap).map(r=>{const net=r.sale-r.refund-r.fees;const profit=net-r.cost;return {...r,net,profit,margin:r.sale?profit/r.sale*100:0};}).sort((a,b)=>b.sale-a.sale);
  const tot=prodRows.reduce((s,r)=>({sale:s.sale+r.sale,vol:s.vol+r.vol,fees:s.fees+r.fees,refund:s.refund+r.refund,cost:s.cost+r.cost,profit:s.profit+r.profit}),{sale:0,vol:0,fees:0,refund:0,cost:0,profit:0});

  return `<div class="topbar"><div class="t-left"><h2>📈 利润分析</h2><p>范围：${FILTER.label} · 按商品/平台/账号看真实盈亏</p></div>
    <div style="display:flex;gap:8px">${rangeUI()}<button class="btn btn-ghost btn-sm" onclick="exportCsv(profitRowsCsv(),'利润分析.csv')">⬇️ 导出</button></div></div>

    ${kpi("商品成本",tot.cost,"money","am")}
    ${kpi("费用+退款",tot.fees+tot.refund,"money","am","扣点+运费+其他+退款")}
    ${kpi("总利润",tot.profit,"money",tot.profit>=0?"gr":"rd","销售额−成本−费用−退款")}
  </div>
  <h3 class="sec"><span class="dot"></span>按商品 · 利润排行</h3>
  <div class="table-wrap"><table><thead><tr><th>商品</th><th>分类</th><th>销量</th><th>销售额</th><th>成本</th><th>费用</th><th>退款</th><th>利润</th><th>利润率</th></tr></thead>
  <tbody>${prodRows.length?prodRows.map(r=>`<tr><td style="font-weight:600">${esc(r.name)}</td><td style="color:var(--muted)">${esc(r.cat)}</td><td>${r.vol}</td><td>${yuan(r.sale)}</td><td>${yuan(r.cost)}</td><td>${yuan(r.fees)}</td><td style="color:var(--red)">${yuan(r.refund)}</td><td style="color:${r.profit>=0?"var(--green)":"var(--red)"};font-weight:700">${yuan(r.profit)}</td><td>${r.margin.toFixed(1)}%</td></tr>`).join(""):`<tr><td colspan="9" style="text-align:center;color:var(--muted)">该范围暂无销售</td></tr>`}</tbody></table></div>
  <h3 class="sec"><span class="dot"></span>按平台 · 利润</h3>
  <div class="grid g-3">${platRows.map(r=>`<div class="card reveal"><div style="font-size:15px;font-weight:700">${esc(r.name)}</div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px"><span>销售额</span><b>${yuan(r.sale)}</b></div><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>费用/退款</span><b style="color:var(--amber)">${yuan(r.fees)} / ${yuan(r.refund)}</b></div><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>成本</span><b style="color:var(--muted)">${yuan(r.cost)}</b></div><div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-weight:800"><span>利润</span><b style="color:${r.profit>=0?"var(--green)":"var(--red)"}">${yuan(r.profit)} <span style="font-size:11px;color:var(--muted)">(${r.margin.toFixed(1)}%)</span></b></div></div>`).join("")}</div>

function savePurchase(id){

  if(id){const old=DB.purchases.find(x=>x.id===id);const op=DB.products.find(p=>p.id===old.productId);if(op)op.stock=Math.max(0,op.stock-old.qty);Object.assign(old,obj);}
  else{DB.purchases.push({id:pid(),...obj});}
  const prod=DB.products.find(p=>p.id===prodId);
  if(prod){prod.stock=(prod.stock||0)+qty;prod.cost=uc;}

}
function delPurchase(id){

}

function inventoryCsv(){return DB.products.map(p=>({SKU:p.sku,商品:p.name,品牌:p.brand||"",分类:p.category,成本价:+p.cost,售价:+p.price,库存:p.stock,安全库存:p.minStock,位置:p.location||"",货值:+(p.stock*p.cost).toFixed(2)}));}

  <div class="table-wrap"><table><thead><tr><th>客户</th><th>单数</th><th>应收</th><th>已收</th><th>未收</th><th>结账日</th><th>状态</th><th>操作</th></tr></thead><tbody>`;
  h+=rows.length?rows.map(r=>`<tr><td style="font-weight:600">${esc(r.name)}</td><td>${r.orders}</td><td>${yuan(r.total)}</td><td style="color:var(--green)">${yuan(r.recv)}</td><td style="color:var(--red);font-weight:700">${yuan(r.remain)}</td><td style="color:var(--muted)">${esc(r.due||"—")}</td><td>${r.remain<=0?"<span class=\"badge green\">已结清</span>":"<span class=\"badge red\">未结</span>"}</td><td><div class="table-actions"><button class="btn btn-primary btn-sm" onclick="collectCredit('${esc(r.name)}')">💰 收款</button><button class="btn btn-ghost btn-sm" onclick="settleCredit('${esc(r.name)}')">✅ 结清</button><button class="btn btn-ghost btn-sm" onclick="viewCreditCus('${esc(r.name)}')">📋 明细</button></div></td></tr>`).join(""):`<tr><td colspan="8" style="text-align:center;color:var(--muted)">暂无未结挂账</td></tr>`;
  h+=`</tbody></table></div>

  h+=creditOrders.filter(o=>!q||(o.creditCustomer||"").toLowerCase().includes(q)||orderName(o).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).map(o=>{const rem=orderPaid(o)-(+o.creditPaid||0);return `<tr><td>${esc(o.date)}</td><td style="font-weight:600">${esc(o.creditCustomer)}</td><td>${esc(orderName(o))}</td><td style="color:var(--amber)">${yuan(orderPaid(o))}</td><td style="color:var(--green)">${yuan(o.creditPaid||0)}</td><td style="color:${rem<=0?"var(--muted)":"var(--red)"};font-weight:700">${yuan(rem)}</td><td>${esc(o.creditDue||"—")}</td><td>${rem<=0?"<span class=\"badge green\">已结清</span>":"<span class=\"badge red\">未结</span>"}</td></tr>`;}).join("");

function collectCredit(name){
  openModal(`<div class="modal-head"><h3>💰 收款（${esc(name)}）</h3><div class="icon-btn" onclick="closeModal()">✖️</div></div><div class="modal-body">

    </div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCollect('${esc(name)}')">确认收款</button></div>`);

function saveCollect(name){
  let amt=+$("#cc_amt").value||0;const dt=$("#cc_date").value||new Date().toISOString().slice(0,10);
  if(amt<=0){toast("请填写收款金额","err");return;}
  const targets=DB.orders.filter(o=>o.payMode==="credit"&&o.creditCustomer===name&&canSee(o.accountId)&&(orderPaid(o)-(+o.creditPaid||0))>0.001).sort((a,b)=>(a.creditDue||"").localeCompare(b.creditDue||""));
  let left=amt;
  targets.forEach(o=>{if(left<=0)return;const rem=orderPaid(o)-(+o.creditPaid||0);const take=Math.min(rem,left);o.creditPaid=(+o.creditPaid||0)+take;o.creditPayments=o.creditPayments||[];o.creditPayments.push({date:dt,amount:take});left-=take;});
  if(left>0)toast("金额大于未收，已按未收全额记录","warn");
  save();closeModal();render();toast("已收款 "+yuan(amt)+"（"+name+"）");
}
function settleCredit(name){if(!confirm(`确认把客户「${name}」剩余挂账全部结清？`))return;const today=new Date().toISOString().slice(0,10);DB.orders.forEach(o=>{if(o.payMode==="credit"&&o.creditCustomer===name&&canSee(o.accountId)&&(orderPaid(o)-(+o.creditPaid||0))>0.001){const rem=orderPaid(o)-(+o.creditPaid||0);o.creditPaid=(+o.creditPaid||0)+rem;o.creditPayments=o.creditPayments||[];o.creditPayments.push({date:today,amount:rem});}});save();render();toast(`客户「${name}」已结清`);}
function creditCsv(){const rows=[];DB.orders.filter(o=>o.payMode==="credit"&&canSee(o.accountId)).forEach(o=>{const rem=orderPaid(o)-(+o.creditPaid||0);rows.push({销售日期:o.date,客户:o.creditCustomer,商品:orderName(o),应收:+orderPaid(o).toFixed(2),已收:+(o.creditPaid||0).toFixed(2),未收:+rem.toFixed(2),结账日:o.creditDue||"",状态:rem<=0?"已结":((o.creditPaid||0)>0?"部分结":"未结")});});return rows;}

        <div style="display:flex;gap:12px;margin-top:6px;font-size:12.5px;flex-wrap:wrap"><span>应收 ${yuan(orderPaid(o))}</span><span>已收 <b style="color:var(--green)">${yuan(o.creditPaid||0)}</b></span><span>未收 <b style="color:${rem<=0?"var(--muted)":"var(--red)"}">${yuan(rem)}</b></span><span>${rem<=0?"<span class=\"badge green\">已结清</span>":"<span class=\"badge red\">未结</span>"}</span></div>

function creditCusCsv(name){const rows=[];DB.orders.filter(o=>o.payMode==="credit"&&o.creditCustomer===name&&canSee(o.accountId)).forEach(o=>{const rem=orderPaid(o)-(+o.creditPaid||0);rows.push({销售日期:o.date,客户:o.creditCustomer,商品:orderName(o),应收:+orderPaid(o).toFixed(2),已收:+(o.creditPaid||0).toFixed(2),未收:+rem.toFixed(2),结账日:o.creditDue||"",收款记录:(o.creditPayments||[]).map(p=>`${p.date||""}¥${(+p.amount).toFixed(2)}`).join(" | "),状态:rem<=0?"已结":((o.creditPaid||0)>0?"部分结":"未结")});});return rows;}

function animate(){
  requestAnimationFrame(()=>{
    let toAnimate=[];
    // counts
    document.querySelectorAll(".count").forEach(el=>{
      const t=+el.dataset.target;const fmt=el.dataset.fmt||"num";
      animateCount(el,t,fmt==="money"?"money":"num");
    });
    // reveal
    const obs=new IntersectionObserver((ents)=>{
      ents.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}});
    },{threshold:.12});
    document.querySelectorAll(".reveal").forEach(el=>obs.observe(el));
    toAnimate.length=0;
  });
}

/* 连接 D 盘数据服务：启动时若 D 盘数据文件较新则恢复，并提示已接通 */
async function syncFromServer(){
  try{
    const r=await fetch(API+"/load",{cache:"no-store"});
    if(!r.ok){return;}
    const d=await r.json();
    // 服务可达即提示（无论是备份还是恢复）
    if(d&&d.orders){const remote=+d.savedAt||0,local=+DB.savedAt||0;
      if(remote>local){DB=d;save();render();toast("已从 D 盘数据文件恢复最新数据");}
      else{toast("已连接 D 盘数据服务，数据自动保存到 D 盘数据文件");}
    }else{
      toast("已连接 D 盘数据服务，数据自动保存到 D 盘数据文件");
    }
  }catch(e){/* 服务未启动时静默，自动使用本地缓存 */}
}

function hashPass(pw,salt){let h=2166136261;const s=(salt||"honghu")+pw;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16);}

  const old=document.getElementById("loginOv");if(old)old.remove();
  const setup=DB.users.length===0;
  const ov=document.createElement("div");ov.id="loginOv";ov.style.cssText="position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#f8fafc 0%,#eceff7 60%,#e3e9f4 100%);display:flex;align-items:center;justify-content:center;padding:20px;";
  const body=setup?`
    <h1 style="font-size:22px;font-weight:800">鸿鹄对账软件</h1>
    <p style="color:#8b93b8;font-size:13px;margin:6px 0 20px">首次使用，请创建管理员（老板）账号</p>
    <input id="su_user" placeholder="设置用户名" style="${LSTYLE}">
    <input id="su_pw1" type="password" placeholder="设置密码（至少4位）" style="${LSTYLE}" onkeydown="if(event.key===\'Enter\')createAdmin()">
    <input id="su_pw2" type="password" placeholder="再次确认密码" style="${LSTYLE}" onkeydown="if(event.key===\'Enter\')createAdmin()">
    <button class="btn btn-primary" style="width:100%;margin-top:14px;justify-content:center" onclick="createAdmin()">✅ 创建并进入</button>
    <div id="su_err" style="color:#f87171;font-size:12px;margin-top:10px"></div>`: 
    `
    <h1 style="font-size:22px;font-weight:800">鸿鹄对账软件</h1>
    <p style="color:#8b93b8;font-size:13px;margin:6px 0 20px">请登录或注册账号</p>
    <div id="loginPanel">
      <input id="lg_user" placeholder="用户名" style="${LSTYLE}">
      <input id="lg_pw" type="password" placeholder="密码" style="${LSTYLE}" onkeydown="if(event.key===\'Enter\')doLogin()">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#8b93b8;margin-top:12px;justify-content:center"><input type="checkbox" id="lg_remember"> 记住账号密码</label>
      <button class="btn btn-primary" style="width:100%;margin-top:14px;justify-content:center" onclick="doLogin()">🔓 登录</button>
      <div id="lg_err" style="color:#f87171;font-size:12px;margin-top:10px"></div>
      <div style="margin-top:14px;font-size:13px;color:#8b93b8">还没有账号？<a style="color:#22d3ee;cursor:pointer" onclick="showReg()">立即注册</a></div>
    </div>
    <div id="regPanel" style="display:none">
      <input id="rg_user" placeholder="用户名" style="${LSTYLE}">
      <input id="rg_pw1" type="password" placeholder="密码（至少4位）" style="${LSTYLE}">
      <input id="rg_pw2" type="password" placeholder="再次确认密码" style="${LSTYLE}" onkeydown="if(event.key===\'Enter\')doRegister()">
      <button class="btn btn-primary" style="width:100%;margin-top:14px;justify-content:center" onclick="doRegister()">📝 注册</button>
      <div id="rg_err" style="color:#f87171;font-size:12px;margin-top:10px"></div>
      <div style="margin-top:14px;font-size:13px;color:#8b93b8">已有账号？<a style="color:#22d3ee;cursor:pointer" onclick="showLog()">返回登录</a></div>
    </div>
    <p style="font-size:11px;color:#8b93b8;margin-top:14px">注册后默认“销售”角色，由管理员分配职位与平台账号。</p>`;
  ov.innerHTML=`<div style="width:100%;max-width:360px;text-align:center"><div style="width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#6c7bff,#22d3ee);display:grid;place-items:center;box-shadow:0 10px 30px rgba(108,123,255,.5)"><svg viewBox="0 0 48 48" width="34" height="34"><path d="M30 5c-6 4-6 12 1 13-7 1-12 6-14 12 4 4 10 5 15 2 7-4 10-11 8-17-1-5-5-8-7-7 0 0 1-4 4-6-3-1-5 0-7 3z" fill="#fff"/><path d="M9 8l6 22" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="43" cy="7" r="3" fill="#ffd166"/></svg></div>${body}</div>`;
  document.body.appendChild(ov);window._bootDone=done;
  try{var _r=JSON.parse(localStorage.getItem("honghuRemember")||"null");if(_r&&document.getElementById("lg_user")){document.getElementById("lg_user").value=_r.u||"";var _pw=document.getElementById("lg_pw");if(_pw)_pw.value=_r.p||"";var _rc=document.getElementById("lg_remember");if(_rc)_rc.checked=true;}}catch(e){}
  (setup?document.getElementById("su_user"):document.getElementById("lg_user")).focus();
}
function doLogin(){
  const u=document.getElementById("lg_user").value.trim();const p=document.getElementById("lg_pw").value;
  const us=DB.users.find(x=>x.username===u);
  if(us&&us.hash===hashPass(p,us.salt)){CUR=us;sessionStorage.setItem("honghuU",us.id);try{var _rm=document.getElementById("lg_remember");if(_rm&&_rm.checked){localStorage.setItem("honghuRemember",JSON.stringify({u:u,p:p}));}else{localStorage.removeItem("honghuRemember");}}catch(e){} const d=document.getElementById("loginOv");if(d)d.remove();if(window._bootDone){window._bootDone();window._bootDone=null;}}
  else{const e=document.getElementById("lg_err");if(e)e.textContent="用户名或密码错误";}
}
function showReg(){const lp=document.getElementById("loginPanel"),rp=document.getElementById("regPanel");if(lp)lp.style.display="none";if(rp)rp.style.display="";}
function showLog(){const lp=document.getElementById("loginPanel"),rp=document.getElementById("regPanel");if(lp)lp.style.display="";if(rp)rp.style.display="none";}
function doRegister(){
  const u=document.getElementById("rg_user").value.trim();const p1=document.getElementById("rg_pw1").value,p2=document.getElementById("rg_pw2").value;
  const err=x=>{const e=document.getElementById("rg_err");if(e)e.textContent=x;};
  if(!u){err("请填写用户名");return;}if(!p1||p1.length<4){err("密码至少 4 位");return;}if(p1!==p2){err("两次密码不一致");return;}
  if(DB.users.some(x=>x.username===u)){err("该用户名已被占用");return;}
  const salt=Math.random().toString(36).slice(2,8);
  const nu={id:pid(),username:u,salt,hash:hashPass(p1,salt),role:"sales",accountIds:[]};
  DB.users.push(nu);save();
  CUR=nu;sessionStorage.setItem("honghuU",nu.id);
  const d=document.getElementById("loginOv");if(d)d.remove();if(window._bootDone){window._bootDone();window._bootDone=null;}
}
function createAdmin(){
  const u=document.getElementById("su_user").value.trim(),p1=document.getElementById("su_pw1").value,p2=document.getElementById("su_pw2").value;
  const err=x=>{const e=document.getElementById("su_err");if(e)e.textContent=x;};
  if(!u){err("请填写用户名");return;}if(!p1||p1.length<4){err("密码至少 4 位");return;}if(p1!==p2){err("两次密码不一致");return;}
  const salt=Math.random().toString(36).slice(2,8);
  const nu={id:pid(),username:u,salt,hash:hashPass(p1,salt),role:"boss",accountIds:DB.accounts.filter(a=>canSee(a.id)).map(a=>a.id)};
  DB.users.push(nu);save();CUR=nu;sessionStorage.setItem("honghuU",nu.id);
  const d=document.getElementById("loginOv");if(d)d.remove();if(window._bootDone){window._bootDone();window._bootDone=null;}
}
async function boot(){
  try{const r=await fetch(API+"/load",{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&d.orders){const remote=+d.savedAt||0,local=+DB.savedAt||0;if(remote>local){DB=d;save();}}}}catch(e){}
  if(cloudEnabled()){try{const cd=await cloudLoad();if(cd&&cd.orders){const remote=+cd.savedAt||0,local=+DB.savedAt||0;if(remote>local){DB=cd;save();}}}catch(e){}}
  DB.users=DB.users||[];
  const lastU=sessionStorage.getItem("honghuU");CUR=DB.users.find(x=>x.id===lastU)||null;
  if(CUR){render();syncFromServer();}
  else{showLogin(()=>{render();syncFromServer();});}
}

/* ================= USER MANAGEMENT (管理员) ================= */
function vSecurity(){
  if(!isAdmin())return `<div class="topbar"><div class="t-left"><h2>🔐 安全设置</h2></div></div><div class="card" style="margin:20px 26px"><div class="empty"><div class="big">🔒</div><p>无权限查看</p></div></div>`;
  let html=`<div class="topbar"><div class="t-left"><h2>👥 用户管理</h2><p>创建/修改账号、设置角色，并给“销售”分配可管理的账号</p></div>
    <button class="btn btn-primary" onclick="openUserForm()">➕ 新增用户</button></div>
  <div class="table-wrap"><table><thead><tr><th>用户名</th><th>角色</th><th>权限范围</th><th>操作</th></tr></thead><tbody>`;
  html+=DB.users.map(u=>`<tr><td style="font-weight:600">${esc(u.username)}</td><td><span class="badge ${u.role==='sales'?'amber':'blue'}">${ROLE_NAME[u.role]||u.role}</span></td><td style="font-size:12px;color:var(--muted)">${u.role==='sales'?((u.accountIds||[]).map(id=>{const a=DB.accounts.find(x=>x.id===id);return a?esc(a.name):"—";}).join("、")||"未分配"):"全部账号"}</td>
   <td><div class="table-actions"><div class="icon-btn edit" onclick="openUserForm('${u.id}')">✏️</div><div class="icon-btn" style="color:var(--red)" onclick="delUser('${u.id}')">🗑️</div></div></td></tr>`).join("");
  html+=`</tbody></table></div><div class="card" style="margin:18px 26px"><div style="font-size:13px;line-height:1.9;color:var(--muted)">📌 角色：<b>老板/财务/主管</b> 看全部账号与全部功能；<b>销售</b> 只能看自己“持号”对应的数据，并能对其持号开单、对账、记费用。<br>首次使用请先创建管理员账号。</div></div>`;
  html+=cloudCardHtml();
  return html;
}
function openUserForm(id){
  const roles=[["boss","老板"],["finance","财务"],["super","主管"],["sales","销售"]];
  const roleOpts=r=>roles.map(x=>`<option value="${x[0]}" ${r===x[0]?"selected":""}>${x[1]}</option>`).join("");
  const accChecks=sel=>{if(!DB.accounts.length)return `<div style="font-size:12px;color:var(--muted)">暂无平台账号，请先到「平台与账号」添加账号。</div>`;return DB.accounts.filter(a=>canSee(a.id)).map(a=>`<label style="font-size:12.5px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:6px"><input type="checkbox" value="${a.id}" ${sel.includes(a.id)?"checked":""}> ${esc(a.name)}</label>`).join("");}
  const idv=id?DB.users.find(x=>x.id===id):{role:"sales",accountIds:[]};
  openModal(`<div class="modal-head"><h3>${id?'✏️ 编辑用户':'➕ 新增用户'}</h3><div class="icon-btn" onclick="closeModal()">✖️</div></div><div class="modal-body">
      <div class="field"><label class="req">用户名</label><input id="u_name" value="${id?esc(idv.username):""}" placeholder="如：小王"></div>
      <div class="field"><label>${id?"重置密码（留空不改）":"密码（至少4位）"}</label><input id="u_pw" type="password" placeholder="${id?'若修改请填写':'至少 4 位'}"></div>
      <div class="field"><label class="req">角色</label><select id="u_role" onchange="roleAccToggle()">${roleOpts(idv.role)}</select></div>
      <div class="field" id="u_acc"><label>她/他管理的账号（销售专用）</label><div style="display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto">${accChecks(idv.accountIds||[])}</div></div>
      </div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveUser('${id||""}')">保存</button></div>`);
  roleAccToggle();
}
function roleAccToggle(){const r=$("#u_role").value;const box=$("#u_acc");if(box)box.style.display=r==="sales"?"":"none";}
function saveUser(id){
  const name=$("#u_name").value.trim();if(!name){toast("请填写用户名","err");return;}
  const role=$("#u_role").value;
  const accs=[...document.querySelectorAll("#u_acc input[type=checkbox]:checked")].map(c=>c.value);
  const pw=$("#u_pw").value;
  if(id){const u=DB.users.find(x=>x.id===id);u.username=name;u.role=role;u.accountIds=accs;if(pw){const salt=Math.random().toString(36).slice(2,8);u.salt=salt;u.hash=hashPass(pw,salt);}toast("用户已更新");}
  else{if(pw.length<4){toast("密码至少 4 位","err");return;}const salt=Math.random().toString(36).slice(2,8);DB.users.push({id:pid(),username:name,salt,hash:hashPass(pw,salt),role,accountIds:accs});toast("用户已创建");}
  save();closeModal();render();
}
function delUser(id){if(!confirm("确定删除该用户？"))return;if(DB.users.length<=1){toast("至少保留一个管理员账号","warn");return;}DB.users=DB.users.filter(x=>x.id!==id);save();render();toast("用户已删除","warn");}
function logout(){CUR=null;sessionStorage.removeItem("honghuU");location.reload();}

/* boot */
try{ if('serviceWorker' in navigator){ if(location.hostname==='localhost'||location.hostname==='127.0.0.1'){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); } else { navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).catch(function(){}); } } }catch(e){}
boot();

</script>
