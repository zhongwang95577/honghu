<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鸿鹄对账软件</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#eef2f7;--bg-2:#f1f5f9;--panel:#ffffff;--panel-2:#fbfcfe;
  --card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --accent:#4f46e5;--accent-2:#0ea5e9;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--violet:#8b5cf6;
  --shadow:0 12px 34px rgba(15,23,42,.09);--radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(160deg,#f8fafc 0%,#eef2f7 55%,#e7edf6 100%);
  color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-track{background:transparent}
.wrap{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:230px;flex-shrink:0;padding:22px 16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#ffffff,#fbfcfe);border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,#6366f1,#0ea5e9);box-shadow:0 8px 22px rgba(99,102,241,.35)}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.3px;color:var(--text)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#586078;cursor:pointer;transition:.22s;font-size:14px;font-weight:600;text-decoration:none;position:relative}
.nav a .ic{font-size:18px;width:22px;text-align:center}
.nav a:hover{background:#eef2f7;color:var(--text);transform:translateX(3px)}
.nav a.active{background:linear-gradient(135deg,#eef0ff,#e6f7ff);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(99,102,241,.18)}
.nav a.active::before{content:"";position:absolute;left:-16px;top:20%;bottom:20%;width:4px;border-radius:4px;background:linear-gradient(#6366f1,#0ea5e9)}
.side-foot{margin-top:auto;padding:12px 10px;font-size:12px;color:var(--muted);background:#f1f5f9;border:1px solid var(--border);border-radius:12px;line-height:1.7}
.side-foot b{color:var(--text);font-size:12px}
.main{flex:1;padding:6px 4px 40px;max-width:100%;margin:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;gap:14px;flex-wrap:wrap}
.topbar .t-left h2{font-size:24px;font-weight:800;letter-spacing:.3px;color:var(--text)}
.topbar .t-left p{color:var(--muted);font-size:13px;margin-top:5px}
.topbar .t-left p b{color:var(--accent)}
.btn{cursor:pointer;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:.22s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;box-shadow:0 10px 24px rgba(99,102,241,.34)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(99,102,241,.44)}
.btn-ghost{background:#ffffff;color:var(--text);border:1px solid var(--border);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.btn-ghost:hover{background:#f1f5f9}
.btn-danger{background:#fee2e2;color:#b91c1c}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:#ffffff;border:1px solid var(--border);color:#64748b;transition:.2s}
.icon-btn:hover{color:var(--text);background:#f1f5f9}
.icon-btn.edit:hover{color:var(--accent)}
.page{animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h3.sec{font-size:17px;font-weight:800;margin:26px 26px 0;display:flex;align-items:center;gap:10px;color:var(--text)}
h3.sec .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(#6366f1,#0ea5e9)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.badge.blue{background:#eef2ff;color:#4338ca}
.badge.green{background:#ecfdf5;color:#047857}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.amber{background:#fef3c7;color:#b45309}
.grid{display:grid;gap:16px;padding:20px 26px}
.g-4{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;transition:.3s;box-shadow:var(--shadow)}
.kpi:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.12)}
.kpi .lbl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .val{font-size:27px;font-weight:800;margin-top:12px;letter-spacing:.3px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .sub{font-size:12px;margin-top:6px;color:var(--muted)}
.kpi .glow{position:absolute;top:-30px;right:-30px;width:110px;height:110px;border-radius:50%;opacity:.16;filter:blur(8px)}
.kpi.bl{--c:var(--accent)}.kpi.gr{--c:var(--green)}.kpi.rd{--c:var(--red)}.kpi.am{--c:var(--amber)}.kpi.cy{--c:var(--accent-2)}
.kpi.bl .glow,.kpi.gr .glow,.kpi.rd .glow,.kpi.am .glow,.kpi.cy .glow{background:var(--c)}
.kpi .up{color:var(--green);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:.3s;box-shadow:var(--shadow)}
.card:hover{box-shadow:0 18px 40px rgba(15,23,42,.10)}
.card h4{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--text)}
.table-wrap{padding:0 10px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
@media (max-width:760px){.table-wrap{-webkit-overflow-scrolling:touch;scrollbar-width:thin}.table-wrap table{min-width:0}.table-wrap::-webkit-scrollbar{height:10px}.table-wrap::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:8px}}
@media (max-width:760px){#view table:not(.no-card),#modal table:not(.no-card){min-width:0!important;display:block;width:100%}#view thead:not(.no-card),#modal thead:not(.no-card){display:none}#view tbody:not(.no-card),#modal tbody:not(.no-card){display:block}#view table:not(.no-card) tbody tr,#modal table:not(.no-card) tbody tr{display:block;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin:9px 12px;box-shadow:var(--shadow)}#view table:not(.no-card) tbody td,#modal table:not(.no-card) tbody td{display:block;border:0!important;padding:4px 0!important;white-space:normal!important;font-size:12.5px}#view tbody td[data-l]:not([data-l=""]):before,#modal tbody td[data-l]:not([data-l=""]):before{content:attr(data-l) "：";color:var(--muted);font-weight:600}#view .table-wrap,#modal .table-wrap{padding-left:0!important;padding-right:0!important}}
@media (max-width:760px){table.no-card{display:block;width:100%}table.no-card thead{display:none}table.no-card tbody{display:block}table.no-card tr{display:block;border:1px solid var(--border);border-radius:12px;padding:6px 9px;margin:7px 0;background:var(--bg-2)}table.no-card td{display:inline-block;width:44%;margin:3px 2%;padding:3px 0!important;border:0!important;font-size:12px;vertical-align:middle}table.no-card td:nth-child(1){display:none}table.no-card td:nth-child(2){width:96%}table.no-card td:nth-child(7){width:96%;text-align:right}table.no-card td:before{content:attr(data-l) "：";color:var(--muted);font-size:11px}table.no-card select,table.no-card input{width:100%!important;font-size:12px!important;padding:5px 4px!important}}
.ocard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin:10px 12px;box-shadow:var(--shadow)}
.tbl-nowrap td{white-space:nowrap}
.tbl-nowrap thead th:first-child,.tbl-nowrap tbody td:first-child{width:34px}
.tbl-nowrap td .cellsub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
thead th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 14px;font-size:13.5px;border-bottom:1px solid #eef2f7;vertical-align:middle;color:var(--text)}
tbody tr{transition:.15s}
tbody tr:hover{background:#f8fafc}
#orderTbl .table-actions .icon-btn:not(.edit){display:none!important}
#orderTbl .table-actions{display:flex;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}
.pchip .em{font-size:14px}
.acct{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:.3s;position:relative;box-shadow:var(--shadow)}
.acct:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,23,42,.10)}
.acct .head{display:flex;align-items:center;gap:12px}
.acct .av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.acct .name{font-weight:800;font-size:15px;color:var(--text)}
.acct .holder{font-size:12px;color:var(--muted);margin-top:2px}
.acct .meta{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);line-height:1.9}
.acct .sum{margin-top:6px;font-size:14px;font-weight:800;color:var(--green)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:42px;opacity:.6;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty p{font-size:14px}
.bar{height:9px;border-radius:10px;background:#e8eef6;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#6366f1,#0ea5e9);transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar.warn>span{background:linear-gradient(90deg,var(--amber),var(--red))}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;animation:fade .25s ease}
.overlay.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:22px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(15,23,42,.20);animation:rise .4s cubic-bezier(.22,1,.36,1)}
.modal.wide{max-width:640px}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;border-radius:22px 22px 0 0}
.modal-head h3{font-size:17px;display:flex;align-items:center;gap:9px;color:var(--text)}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:700}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:#ffffff;color:var(--text);font-size:14px;transition:.2s;font-family:inherit;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
.field .row{display:flex;gap:10px}
.field .row>*{flex:1}
.field textarea{resize:vertical;min-height:70px}
.req::after{content:" *";color:var(--red)}
#toasts{position:fixed;top:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px}
.toast{background:#ffffff;border:1px solid var(--border);border-left:4px solid var(--green);color:var(--text);padding:14px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);min-width:240px;animation:slideIn .4s cubic-bezier(.22,1,.36,1);display:flex;align-items:center;gap:10px}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:var(--amber)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:slideOut .4s ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:18px 26px 0}
.tab{padding:8px 15px;border-radius:10px;background:#eef2f7;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;border:1px solid transparent;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:transparent}
.ln{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--text)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 26px;margin-top:6px}
.filterbar select,.filterbar input{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:#ffffff;color:var(--text);font-size:13px;outline:none}
.chart-legend{display:flex;flex-direction:column;gap:12px;width:100%}
.leg-row{display:flex;align-items:center;gap:10px;font-size:13px}
.leg-row .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.leg-row .nm{flex:1;color:var(--text);font-weight:600}
.leg-row .pct{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.status-sel{padding:5px 8px;border-radius:8px;background:#ffffff;color:var(--text);border:1px solid var(--border);font-size:12px;outline:none;cursor:pointer}
.status-sel:focus{border-color:var(--accent)}
@media(max-width:820px){
  .wrap{flex-direction:column}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto;border-right:0;border-top:1px solid var(--border);z-index:80;background:#fff}
  .brand{display:none}
  .nav{flex-direction:row;gap:2px;margin:0;width:100%}
  .nav a{flex-direction:column;gap:2px;padding:7px 10px;font-size:10px;min-width:60px;border-radius:10px;white-space:nowrap}
  .nav a .ic{width:auto;font-size:18px}
  .nav a:hover{transform:none}
  .side-foot{display:none}
  .main{padding:6px 6px 86px;max-width:100%;margin:0}
  .topbar{padding:14px 14px 6px;gap:10px}
  .topbar .t-left h2{font-size:19px}
  .topbar .t-left p{font-size:12px}
  .filterbar{padding:0 14px;margin-top:4px;gap:8px}
  .filterbar select,.filterbar input{padding:9px 10px;font-size:13px}
  .grid{gap:12px;padding:14px}
  .grid.g-kpi{grid-template-columns:1fr 1fr}
  .grid.g-2{grid-template-columns:1fr}
  h3.sec{margin-left:14px;font-size:15px}
  .table-wrap{padding-left:8px;padding-right:8px;overflow-x:auto}
  table{font-size:12px}
  th,td{padding:8px 9px;white-space:nowrap}
  .modal{width:100%!important;max-width:100%!important;border-radius:16px}
  .overlay{padding:10px}
  .btn{padding:11px 16px}
}
.reveal{opacity:0;transform:translateY(20px);transition:.6s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
.count{display:inline-block}
</style>
</head>

const orderPaid=o=>orderGross(o)+buyerShip(o);            // 买家实付 = 商品金额 + 买家运费

const effQty=o=>isRefund(o)?0:(o.qty||0);

const orderCost=o=>{var _f=(o.packFactor||1);if(o.isTemp)return (+o.tempCost||0)*effQty(o)*_f;const p=DB.products.find(x=>x.id===o.productId);return p?(p.cost||0)*effQty(o)*_f:0;};

/* ================= KPI CALC ================= */
function platformTotals(platformId,accountId){
  let sale=0,order=0,exp=0,fees=0,cogs=0,refund=0,ship=0;var _seenOrders={};
  const pAll=!platformId||platformId==="all";
  const aAll=!accountId||accountId==="all";
  DB.orders.forEach(o=>{
    if(!pAll&&o.platformId!==platformId)return;
    if(!aAll&&o.accountId!==accountId)return;
    if(!withinDate(o))return;
    if(!canSee(o.accountId))return;
    sale+=orderPaid(o);if(!_seenOrders[o.gid||o.id]){_seenOrders[o.gid||o.id]=1;order++;}fees+=orderFees(o);cogs+=orderCost(o);refund+=orderRefund(o);ship+=buyerShip(o);
  });
  DB.expenses.forEach(e=>{
    if(!pAll&&e.platformId!==platformId)return;
    if(!aAll&&e.accountId!==accountId)return;
    if(!withinDate(e))return;
    if(!canSee(e.accountId))return;
    exp+=e.amount;
  });
  const net=sale-fees-refund;
  const profit=net-cogs-exp;
  return {sale,order,exp,fees,cogs,refund,ship,net,profit};
}
function globalTotals(){
  let sale=0,order=0,exp=0,fees=0,cogs=0,refund=0,ship=0,stockV=0;var _seenOrders={};
  DB.orders.forEach(o=>{if(!withinDate(o))return;if(!canSee(o.accountId))return;sale+=orderPaid(o);if(!_seenOrders[o.gid||o.id]){_seenOrders[o.gid||o.id]=1;order++;}fees+=orderFees(o);cogs+=orderCost(o);refund+=orderRefund(o);ship+=buyerShip(o);});
  DB.expenses.forEach(e=>{if(!withinDate(e))return;if(!canSee(e.accountId))return;exp+=e.amount;});
  DB.products.forEach(p=>{stockV+=p.stock*p.cost;});
  const net=sale-fees-refund;
  const profit=net-cogs-exp;
  return {sale,order,exp,fees,cogs,refund,ship,net,profit,stockV};
}

/* ================= COUNTER ANIMATION ================= */
function animateCount(el,target,format){
  const start=0,dur=900,startT=performance.now();
  const fmtFn=format==="money"?v=>yuan(v):v=>String(Math.round(v));
  function tick(t){
    const p=Math.min(1,(t-startT)/dur);
    const eased=1-Math.pow(1-p,3);
    el.textContent=fmtFn(target*eased);
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function biImport(){

      var cells=line.split(/\t|,|，/).map(function(s){return s.trim();});
      if(/^(名称|商品|商品名称|name)$/i.test(cells[0]))return;
      var name=cells[0];if(!name)return;
      var sku=cells[1]||"",bc=cells[2]||"",cat=cells[3]||"",brand=cells[4]||"",unit=cells[5]||"个",cost=+cells[6]||0,price=+cells[7]||0,stock=+cells[8]||0;
      var ex=DB.products.find(function(p){return (p.name||"").trim()===name;});
      if(ex){ ex.stock=(+ex.stock||0)+stock; if(cost)ex.cost=cost; if(price)ex.price=price; upd++; }
      else{ DB.products.push({id:pid(),name:name,sku:sku,barcode:bc,category:cat,brand:brand,unit:unit,cost:cost,price:price,stock:stock,minStock:0,location:"",variants:[],units:[]}); add++; }

}

function openScanPick(target){
  var tgt=(typeof target==='string')?document.querySelector(target):target;

  window._scanTarget=tgt;
  try{ var old=document.getElementById('scanOv'); if(old)old.remove(); }catch(e){}
  var support=(typeof BarcodeDetector!=='undefined');
  var ov=document.createElement('div');
  ov.id='scanOv';
  ov.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(15,23,42,.55);z-index:9999;display:flex;align-items:flex-end;justify-content:center';

   +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>📷 扫条码（扫到自动填入）</b><span class="icon-btn" onclick="closeScanPick()">✖️</span></div>'
   +'<video id="scanVid" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000;max-height:46vh;object-fit:cover"></video>'
   +'<div id="scanMsg" class="hint" style="margin-top:8px">正在打开摄像头…</div>'
   +'<div id="scanManWrap" style="display:none;margin-top:10px"><label>手动输入条码</label><div style="display:flex;gap:8px"><input id="scanMan" placeholder="直接输入条码，回车确定" style="flex:1"><button type="button" class="btn btn-primary" onclick="scanManOk()">确定</button></div></div>'
   +'<div class="hint" style="margin-top:8px">电脑没有摄像头、或浏览器不支持时，可直接手动输入；手机请用 https 地址打开本页。</div>'
   +'</div>';
  document.body.appendChild(ov);
  var v=document.getElementById('scanVid'), msg=document.getElementById('scanMsg');
  setTimeout(function(){ try{ var m=document.getElementById('scanMan'); if(m)m.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); scanManOk(); } }); }catch(e){} },60);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if(msg)msg.textContent='此环境不支持摄像头，请手动输入'; showScanManual(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(st){
    window._scanStream=st; try{ v.srcObject=st; v.play().catch(function(){}); }catch(e){}
    if(!support){ if(msg)msg.textContent='此浏览器不支持自动识别，请手动输入（或改用手机扫码页）'; showScanManual(); return; }
    if(msg)msg.textContent='对准条码，扫到自动填入…';
    var det=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','codabar','itf','qr_code']});
    var last='';
    window._scanTimer=setInterval(function(){
      if(!document.getElementById('scanVid')){ try{clearInterval(window._scanTimer);}catch(e){} return; }
      det.detect(v).then(function(rs){ if(rs&&rs.length){ var code=(rs[0].rawValue||'').trim(); if(code&&code!==last){ last=code; scanFill(code); } } }).catch(function(){});
    },260);
  }).catch(function(e){
    if(msg)msg.textContent='打不开摄像头：'+(e&&e.message?e.message:e)+'（可手动输入）';
    showScanManual();
  });
}

function scanFill(code){

function saveProduct(id){

  const cat=catValue();

    cost:+((document.getElementById("f_bcost")||{}).value||$("#f_cost").value)||0,price:+((document.getElementById("f_bprice")||{}).value||$("#f_price").value)||0,
    stock:+$("#f_stock").value||0,minStock:+$("#f_min").value||0,location:$("#f_loc").value.trim(),pairCost:+((document.getElementById("f_pairCost")||{}).value||0),pairPrice:+((document.getElementById("f_pairPrice")||{}).value||0),oneCost:+((document.getElementById("f_oneCost")||{}).value||0),onePrice:+((document.getElementById("f_onePrice")||{}).value||0),pairFactor:+((document.getElementById("f_pairFactor")||{}).value||2),oneUnit:((document.getElementById("f_oneUnit")||{}).value||"单只"),pairQty:+((document.getElementById("f_pairQty")||{}).value||0),oneQty:+((document.getElementById("f_oneQty")||{}).value||0)};
  if(obj.variants&&obj.variants.length){var _vs=0;obj.variants.forEach(function(v){_vs+=(+v.stock||0)});obj.stock=_vs;}
  if(cat&&!DB.cats.includes(cat))DB.cats.push(cat);
  if(brand&&!DB.brands.includes(brand))DB.brands.push(brand);
  if(id){Object.assign(DB.products.find(x=>x.id===id),obj);logAct("修改商品",obj.name);toast("商品已更新");}

function pickProdImgMore(inp){
  try{
    var f=(inp.files&&inp.files[0]);if(!f)return;
    if(f.size>300*1024){toast("图片太大（≤300KB）","err");inp.value="";return;}
    var t=(window._prodTarget?DB.products.find(function(x){return x.id===window._prodTarget;}):null);if(!t){toast("请先保存商品再追加图片","warn");inp.value="";return;}
    var r=new FileReader();
    r.onload=function(){ t.imgs=t.imgs||[]; t.imgs.push(String(r.result)); save(); toast("已追加图片（共 "+t.imgs.length+" 张）"); };
    r.readAsDataURL(f);inp.value="";
  }catch(e){toast("失败："+e.message,"err");}
}
function delProduct(id){
  if(!confirm("确定删除该商品？其关联订单记录将保留，但会显示为未知商品。"))return;
  DB.products=DB.products.filter(p=>p.id!==id);save();render();toast("商品已删除","warn");
}

function recalcOrder(){
  if(!document.getElementById("f_price")||!document.getElementById("f_qty"))return;
  const price=+$("#f_price").value||0,qty=+$("#f_qty").value||0;
  const gross=price*qty;
  const bship=+(document.getElementById("f_buyerShip")?document.getElementById("f_buyerShip").value:0)||0;
  const paid=gross+bship;
  const rate=+$("#f_commRate").value||0;
  const comm=Math.round(paid*rate/100*100)/100;
  const extraRate=+$("#f_extraRate").value||0;
  const extra=Math.round(paid*extraRate/100*100)/100;
  const ship=+$("#f_shipping").value||0, other=+$("#f_other").value||0;
  const refund=(document.getElementById("f_refundAmount")?+document.getElementById("f_refundAmount").value:0)||0;
  const fees=comm+extra+ship+other;const net=paid-refund-fees;
  const st=$("#f_status")?$("#f_status").value:"";
  const eff=REFUND_ST.includes(st)?0:qty;
  const prod=DB.products.find(p=>p.id===$("#f_prod").value);
  const ptypeEl=document.querySelector("input[name=ptype]:checked");const isTempForm=!!(ptypeEl&&ptypeEl.value==="temp");
  const tc=isTempForm?(+($("#f_tempCost")?$("#f_tempCost").value:0)||0):0;
  const cogs=isTempForm?tc*eff:(prod?prod.cost*eff:0);const profit=net-cogs;
  const set=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt;};
  set("f_gross",yuan(gross));set("f_bship",yuan(bship));set("f_paid",yuan(paid));
  set("f_comm","¥"+fmt(comm));set("f_extra","¥"+fmt(extra));set("f_ship",yuan(ship));set("f_otherd",yuan(other));
  set("f_refundd",yuan(refund));set("f_fees",yuan(fees));set("f_net",yuan(net));set("f_cogs",yuan(cogs));set("f_profit",yuan(profit));
}

function prevRange(){

  var pf=new Date(pt.getTime()-(days-1)*86400000);
  return {from:pf.toISOString().slice(0,10),to:pt.toISOString().slice(0,10)};
}

function _debtsRows(list){
  var out=[];
  (list||[]).forEach(function(d){
    var amt=+d.amount||0, paid=+d.paid||0, owe=amt-paid;
    var st=owe<=0?"已还清":(paid>0?"部分还":"未还");
    var ps=(d.payments||[]).slice();
    function mk(idx,dt,am,nt,left){return {借款人:d.name,联系方式:d.contact||"",借款金额:amt,已还:paid,未还:owe,借款日:d.date||"",约定还款日:d.dueDate||"",状态:st,分期序号:idx,还款日期:dt,还款金额:am,还款备注:nt,还款后剩余:left,备注:d.note||""};}
    if(!ps.length){ out.push(mk("","","","",owe)); }
    else{ var left=amt; ps.forEach(function(p,i){ left=left-(+p.amount||0); out.push(mk((i+1)+"/"+ps.length, p.date||"", (+p.amount||0), p.note||"", left)); }); }
  });
  return out;
}

function rmbUpper(n){
  n=Math.round((+n||0)*100)/100;
  if(n===0)return "零元整";
  const dig="零壹贰叁肆伍陆柒捌玖",un=["","拾","佰","仟"],bu=["","万","亿","万亿"];
  const neg=n<0;n=Math.abs(n);
  let ip=Math.floor(n),dp=Math.round((n-ip)*100),s="";
  if(ip===0){s="零";}else{let gi=0;
    while(ip>0){let g=ip%10000,gs="",pos=0,nz=false;
      while(g>0){const d=g%10;if(d===0){if(gs&&!nz){gs="零"+gs;}nz=true;}else{gs=dig[d]+un[pos]+gs;nz=false;}g=Math.floor(g/10);pos++;}
      if(gs)s=gs+bu[gi]+s;ip=Math.floor(ip/10000);gi++;}
  }
  s=s.replace(/零+/g,"零").replace(/零$/,"");
  let r=s+"元";
  if(dp===0){r+="整";}else{const j=Math.floor(dp/10),f=dp%10;if(j>0)r+=dig[j]+"角";if(f>0){if(j===0)r+="零";r+=dig[f]+"分";}}
  return (neg?"负":"")+r;
}

  const autoprint=opts.autoprint!==false;
  const p=DB.products.find(x=>x.id===o.productId);const pl=pmeta(o.platformId);const ac=DB.accounts.find(a=>a.id===o.accountId);
  const gross=orderGross(o),fees=orderFees(o),refund=orderRefund(o),net=orderNet(o),extra=orderExtra(o);
  const today=new Date().toISOString().slice(0,10);
  const fs=cfg.font||13,store=cfg.store||"",prefix=cfg.prefix||"";
  const money=n=>Number(n||0).toFixed(2);

    body=`

      <div class="prod"><b>${esc(orderName(o))}</b> × ${o.qty} ${esc(unit)}　¥${money(gross)}</div>
      ${(cfg.note!==false&&o.note)?`<div class="note">备注：${esc(o.note)}</div>`:""}
      <div class="foot2">${esc(store)}${cfg.ts!==false?(" · 制单 "+today):""}</div>${cfg.qr?("<div style=\"text-align:center;margin-top:4px\">"+qrTag(noStr,72)+"</div>"):""}
    </div>`;
  } else if(cfg.type==="full"){
    body=`
    <div class="s">
      <div class="co">${esc(store)}</div>
      <div class="doctype">${esc(cfg.title||"发货单")}</div>
      <div class="meta1"><span>NO.${esc(noStr)}</span><span>销售日期：${esc(o.date)}</span></div>
      <div class="meta2"><span>客户：${esc(o.buyer)}</span><span>${cfg.contact?"联系电话："+esc(o.contact||"—"):""}</span></div>
      ${(cfg.shaddr!==false&&o.addr)?('<div class="meta2"><span>送货地址：'+esc(o.addr)+'</span>'+(o.deliverDate?('<span>送货日期：'+esc(o.deliverDate)+'</span>'):'')+'</div>'):''}
      ${(o.payMode==="credit")?('<div class="meta2"><span>挂账客户：'+esc(o.creditCustomer||"")+'</span>'+(cfg.owes?('<span>本单未收：'+money(orderPaid(o)-(+o.creditPaid||0))+'</span>'):'')+'</div>'+(cfg.payments?('<div style="text-align:left;padding:2mm 4mm;font-size:'+(fs-2)+'px;color:#333">收款记录：'+((o.creditPayments||[]).map(function(p){return String(p.date||"")+' ¥'+money(p.amount);}).join("　")||"无")+'</div>'):'')):''}
      <table class="items"><thead><tr><th style="width:8%">编号</th><th>产品</th><th style="width:8%">单位</th><th style="width:10%">数量</th><th style="width:12%">单价</th><th style="width:14%">金额</th><th style="width:16%">备注</th></tr></thead><tbody>
        <tr><td>1</td><td>${esc(orderName(o))}</td><td>${esc(unit)}</td><td>${o.qty}</td><td>${numv(o.price)}</td><td>${money(gross)}</td><td>${esc(note)}</td></tr>
        <tr class="sumrow"><td></td><td>合计</td><td></td><td>${o.qty}</td><td></td><td>${money(gross)}</td><td></td></tr>
      </tbody></table>
      <div class="tot"><span>产品合计：${money(gross)}</span><span>合计金额：${rmbUpper(orderPaid(o))}  ${money(orderPaid(o))}</span></div>
      <div class="fee">买家运费 ${money(buyerShip(o))} ｜ 平台扣点 ${money(o.comm||0)}${extra?" ｜ 增值服务费 "+money(extra):""} ｜ 运费成本 ${money(o.shipping||0)} ｜ 其他 ${money(o.other||0)} ｜ 退款 ${money(refund)} ｜ <b>净收入 ${money(net)}</b></div>
      <div class="foot"><div class="fl">订货电话：${esc(cfg.phones)}${cfg.qr?("　"+qrTag(noStr,56)):""}</div><div class="fr">制单人：${esc((typeof o!=="undefined"&&o.maker)||(CUR&&CUR.username)||cfg.by||((typeof o!=="undefined"&&o.seller)||(typeof orders!=="undefined"&&orders[0]&&orders[0].seller)||""))}</div><div class="fl">订货地址：${esc(cfg.addr)}</div><div class="fr">收货人(签字)：</div></div>
    </div>`;
  } else {
    body=`
    <div class="s">
      <div class="co">${esc(store)}</div>
      <div class="doctype">${esc(cfg.title||"销售单")}</div>
      <div class="meta1"><span>NO.${esc(noStr)}</span><span>销售日期：${esc(o.date)}</span></div>
      <div class="meta2"><span>客户：${esc(o.buyer)}</span><span>${cfg.contact?"联系电话："+esc(o.contact||"—"):""}</span></div>
      ${(cfg.shaddr!==false&&o.addr)?('<div class="meta2"><span>送货地址：'+esc(o.addr)+'</span>'+(o.deliverDate?('<span>送货日期：'+esc(o.deliverDate)+'</span>'):'')+'</div>'):''}
      ${(o.payMode==="credit")?('<div class="meta2"><span>挂账客户：'+esc(o.creditCustomer||"")+'</span>'+(cfg.owes?('<span>本单未收：'+money(orderPaid(o)-(+o.creditPaid||0))+'</span>'):'')+'</div>'+(cfg.payments?('<div style="text-align:left;padding:2mm 4mm;font-size:'+(fs-2)+'px;color:#333">收款记录：'+((o.creditPayments||[]).map(function(p){return String(p.date||"")+' ¥'+money(p.amount);}).join("　")||"无")+'</div>'):'')):''}
      <table class="items"><thead><tr><th style="width:8%">编号</th><th>产品</th><th style="width:8%">单位</th><th style="width:10%">总数量</th><th style="width:12%">单价</th><th style="width:14%">金额</th><th style="width:16%">备注</th></tr></thead><tbody>
        <tr><td>1</td><td>${esc(orderName(o))}</td><td>${esc(unit)}</td><td>${o.qty}</td><td>${numv(o.price)}</td><td>${money(gross)}</td><td>${esc(note)}</td></tr>
        <tr class="sumrow"><td></td><td>合计</td><td></td><td>${o.qty}</td><td></td><td>${money(gross)}</td><td></td></tr>
      </tbody></table>
      <div class="tot"><span>产品合计：${money(gross)}</span><span>合计金额：${rmbUpper(gross)}  ${money(gross)}</span></div>
      <div class="foot"><div class="fl">订货电话：${esc(cfg.phones)}${cfg.qr?("　"+qrTag(noStr,56)):""}</div><div class="fr">制单人：${esc((typeof o!=="undefined"&&o.maker)||(CUR&&CUR.username)||cfg.by||((typeof o!=="undefined"&&o.seller)||(typeof orders!=="undefined"&&orders[0]&&orders[0].seller)||""))}</div><div class="fl">订货地址：${esc(cfg.addr)}</div><div class="fr">收货人(签字)：</div></div>
    </div>`;
  }
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${esc(store)} ${esc(cfg.title||"单据")}</title><style>
    @page{size:${size};margin:${label?4:10}mm;}
    *{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:"SimSun","宋体","Microsoft YaHei",serif;color:#000;background:#fff;font-size:${fs}px}
    .s{padding:6px 8px}
    .co{text-align:center;font-size:${fs+11}px;font-weight:800;letter-spacing:3px;font-family:"Microsoft YaHei",sans-serif}
    .doctype{text-align:center;font-size:${fs+5}px;font-weight:700;letter-spacing:10px;margin:4px 0 10px;font-family:"Microsoft YaHei",sans-serif}
    .meta1,.meta2{display:flex;justify-content:space-between;font-size:${fs+1}px;margin:3px 0}
    table.items{width:100%;border-collapse:collapse;margin-top:8px}
    table.items th,table.items td{border:1px solid #000;padding:6px 7px;font-size:${fs}px}
    table.items th{font-weight:700;text-align:center;background:#f4f4f4}
    table.items td{text-align:center}
    table.items td.l{text-align:left}
    table.items td.r{text-align:right}
    table.items .sumrow td{font-weight:700}
    .tot{display:flex;justify-content:space-between;font-size:${fs+1}px;margin-top:8px;font-weight:700}
    .fee{font-size:${fs-1}px;margin-top:6px;color:#333}
    .foot{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:${fs}px;margin-top:12px}
    .foot .fr{text-align:right}
    .oid{font-size:${fs-1}px;margin:4px 0}
    .buyer{font-size:${fs+2}px;font-weight:700;margin:5px 0;line-height:1.5}
    .prod{font-size:${fs+2}px;margin:5px 0}
    .note{font-size:${fs-1}px;border-top:1px dashed #999;margin-top:6px;padding-top:4px}

<style>@media print{.noprint{display:none!important}}</style>
<div class="noprint" style="position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:99">
  <button onclick="window.print()" style="padding:10px 18px;font-size:15px;font-weight:700;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer">🖨️ 打印 / 存为 PDF</button>
  <button onclick="window.close()" style="padding:10px 16px;font-size:15px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#334155;cursor:pointer">✖ 关闭</button>
</div>
${autoprint?('<'+'script>function _doPrint(){try{window.focus();window.print();}catch(e){}}if(document.readyState==="complete")setTimeout(_doPrint,400);else window.addEventListener("load",function(){setTimeout(_doPrint,400);});</'+'script>'):''}</body></html>`;
}
/* ================= RENDER: RECON ================= */
function vRecon(){
  const h=`<div class="topbar"><div class="t-left"><h2>⚖️ 对账中心</h2><p>按平台 / 账号独立对账 · 收入 · 支出 · 利润</p></div></div>`;
  return h+vReconBody();
}
function vReconBody(){
  const pf=$("#rec_p")?$("#rec_p").value:"all";
  const ac=$("#rec_a")?$("#rec_a").value:"all";
  const t=platformTotals(pf,ac);
  return `<div class="filterbar">
    ${rangeUI()}
    <select id="rec_p" onchange="reconRefresh()">
      <option value="all">全部平台</option>
      ${myPlatforms().map(p=>`<option value="${p.id}" ${pf===p.id?"selected":""}>${p.em} ${p.name}</option>`).join("")}
    </select>
    <select id="rec_a" onchange="reconRefresh()">
      <option value="all">全部账号</option>
      ${DB.accounts.filter(a=>(pf==="all"||a.platformId===pf)&&canSee(a.id)).map(a=>`<option value="${a.id}" ${ac===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}
    </select>
    <span style="font-size:12.5px;color:var(--muted)">当前范围合计</span>
  </div>
  <div class="grid g-kpi" style="padding-top:12px">
    ${kpi("销售额",t.sale,"money","cy")}
    ${kpi("订单数",t.order,"num","bl")}
    ${kpi("订单费用",t.fees,"money","am","平台扣点+运费+其他")}
    ${kpi("退款",t.refund,"money","rd","已退款/退货金额")}
    ${kpi("商品成本",t.cogs,"money","bl","按有效销量成本")}
    ${kpi("平台支出",t.exp,"money","am","运费/广告/杂费")}
    ${kpi("净利",t.profit,"money",t.profit>=0?"gr":"rd","扣退款、成本与扣费后")}
  </div>
  <div class="grid g-2">
    <div class="card reveal">
      <h4>🧾 订单明细（当前范围）</h4>
      ${(()=>{let rows=DB.orders.filter(o=>(pf==="all"||o.platformId===pf)&&(ac==="all"||o.accountId===ac)&&canSee(o.accountId)&&withinDate(o)).sort((a,b)=>b.date.localeCompare(a.date));
        if(!rows.length)return emptyLg("当前范围暂无订单");
        return `<div style="max-height:340px;overflow-y:auto">${rows.map(o=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)">
          <span style="font-size:14px">${pmeta(o.platformId).em}</span>
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(orderName(o))}</div>
          <div style="font-size:11px;color:var(--muted)">${esc(aname(o.accountId))} · ${esc(o.date)}</div></div>
          <div style="text-align:right"><div style="color:var(--green);font-weight:700">+${yuan(o.qty*o.price)}</div><div style="font-size:10px;color:var(--muted)">净 ${yuan(orderNet(o))}</div></div></div>`).join("")}</div>`;})()}
    </div>
    <div class="card reveal">
      <h4>💸 支出明细（当前范围）</h4>
      ${(()=>{let rows=DB.expenses.filter(e=>(pf==="all"||e.platformId===pf)&&(ac==="all"||e.accountId===ac)&&canSee(e.accountId)&&withinDate(e)).sort((a,b)=>b.date.localeCompare(a.date));
        if(!rows.length)return emptyLg("当前范围暂无支出");
        return `<div style="max-height:340px;overflow-y:auto">${rows.map(e=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)">
          <span style="font-size:14px">${pmeta(e.platformId).em}</span>
          <div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(e.cat)}</div>
          <div style="font-size:11px;color:var(--muted)">${esc(e.note||"—")} · ${esc(e.date)}</div></div>
          <b style="color:var(--red)">−${yuan(e.amount)}</b></div>`).join("")}</div>`;})()}
    </div>
  </div>
  <h3 class="sec"><span class="dot"></span>按平台独立对账</h3>
  <div class="grid g-2" style="padding-top:14px">
    ${myPlatforms().filter(p=>(pf==="all"||p.id===pf)).map(p=>{
      const _accs=visibleUid(p.id).filter(a=>(ac==="all"||a.id===ac));if(!_accs.length)return "";
      const tt=platformTotals(p.id,ac);const margin=tt.sale?tt.profit/tt.sale*100:0;
      return `<div class="acct reveal">
        <div class="head"><div class="av" style="background:${p.c}">${p.em}</div>
          <div><div class="name">${esc(p.name)}</div><div class="holder">${_accs.length} 个账号 · 含平台扣点/运费核算</div></div>
        </div>
        <div class="meta">${_accs.map(a=>{const at=platformTotals(p.id,a.id);return `<div onclick="reconAcctDetail('${p.id}','${a.id}')" style="cursor:pointer;padding:6px 0" title="点击查看每笔明细">▸ ${esc(a.name)}（${esc(a.holder)}）：收入 <b style="color:var(--green)">${yuan(at.sale)}</b> · 净利 <b style="color:${at.profit>=0?"var(--green)":"var(--red)"}">${yuan(at.profit)}</b></div>`;}).join("")||"暂无账号"}</div>
        <div class="sum">收入 ${yuan(tt.sale)} · 净收入 ${yuan(tt.net)}</div>
        <div style="display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap">
          <span>扣费 <b style="color:var(--amber)">${yuan(tt.fees)}</b></span>
          <span>成本 <b style="color:var(--muted)">${yuan(tt.cogs)}</b></span>
          <span>支出 <b style="color:var(--red)">${yuan(tt.exp)}</b></span>
          <span>净利 <b style="color:${tt.profit>=0?"var(--green)":"var(--red)"}">${yuan(tt.profit)}</b></span>
          <span>利润率 <b>${margin.toFixed(1)}%</b></span>
        </div>
      </div>`;}).join("")}
  </div>`;
}
function reconAcctDetail(pid,aid){
  var a=DB.accounts.find(function(x){return x.id===aid;})||{};
  var t=platformTotals(pid,aid);
  var orders=DB.orders.filter(function(o){return o.accountId===aid&&canSee(o.accountId);}).sort(function(x,y){return String(y.date||"").localeCompare(String(x.date||""));});
  var exps=DB.expenses.filter(function(e){return e.accountId===aid&&canSee(e.accountId);}).sort(function(x,y){return String(y.date||"").localeCompare(String(x.date||""));});
  var h="";
  h+='<div class="modal-head"><h3>📄 '+esc(a.name||"")+'（'+esc(a.holder||"")+'）· 对账明细</h3><div class="icon-btn" onclick="closeModal()">✖️</div></div>';
  h+='<div class="modal-body">';
  h+='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:13px">';
  h+='<span>销售额 <b style="color:var(--green)">'+yuan(t.sale)+'</b></span>';
  h+='<span>订单费用 <b style="color:var(--amber)">'+yuan(t.fees)+'</b></span>';
  h+='<span>退款 <b style="color:var(--red)">'+yuan(t.refund||0)+'</b></span>';
  h+='<span>商品成本 <b>'+yuan(t.cogs)+'</b></span>';
  h+='<span>平台支出 <b style="color:var(--red)">'+yuan(t.exp)+'</b></span>';
  h+='<span>净利 <b style="color:'+(t.profit>=0?'var(--green)':'var(--red)')+'">'+yuan(t.profit)+'</b></span>';
  h+='</div>';
  h+='<h4 style="margin:10px 0 6px">订单明细（'+orders.length+' 笔）</h4>';
  h+='<div class="table-wrap" style="padding:0"><table class="tbl-nowrap"><thead><tr><th>销售日期</th><th>商品</th><th>数量</th><th>实付</th><th>订单费用</th><th>净收入</th><th>买家</th><th>销售</th></tr></thead><tbody>';
  h+=orders.length?orders.map(function(o){var fees=orderFees(o),net=orderNet(o);return '<tr><td>'+esc(o.date)+'</td><td>'+esc(orderName(o))+'</td><td>'+(o.qty||0)+'</td><td style="color:var(--green)">'+yuan(orderPaid(o))+'</td><td style="color:var(--amber)">'+yuan(fees)+'</td><td>'+yuan(net)+'</td><td>'+esc(o.buyer||"")+'</td><td>'+esc(o.seller||"—")+'</td></tr>';}).join(""):'<tr><td colspan="8" style="text-align:center;color:var(--muted)">无订单</td></tr>';
  h+='</tbody></table></div>';
  h+='<h4 style="margin:14px 0 6px">支出明细（'+exps.length+' 笔）</h4>';
  h+='<div class="table-wrap" style="padding:0"><table class="tbl-nowrap"><thead><tr><th>日期</th><th>分类</th><th>备注</th><th>金额</th></tr></thead><tbody>';
  h+=exps.length?exps.map(function(e){return '<tr><td>'+esc(e.date)+'</td><td>'+esc(e.cat||"")+'</td><td>'+esc(e.note||"")+'</td><td style="color:var(--red)">－'+yuan(e.amount)+'</td></tr>';}).join(""):'<tr><td colspan="4" style="text-align:center;color:var(--muted)">无支出</td></tr>';
  h+='</tbody></table></div>';
  h+='</div>';
  openModal(h);
}

function reconRefresh(){$("#view").innerHTML=vRecon();animate();}

/* ================= RENDER: EXPENSE ================= */

        <td><span class="badge amber">${esc(e.cat)}</span></td><td style="color:var(--red);font-weight:700">−${yuan(e.amount)}</td>

function matchRate(platformId,category){
  if(!platformId)return null;
  const rs=DB.rates.filter(r=>r.platformId===platformId);
  return rs.find(r=>r.category===category)||rs.find(r=>!r.category)||null;
}
function autoRate(apply){
  const p=$("#f_prod")?$("#f_prod").value:"";
  const prod=DB.products.find(x=>x.id===p);
  const cat=prod?prod.category:"";
  const r=matchRate($("#f_p")?$("#f_p").value:"",cat);
  const hint=document.getElementById("f_rateHint");
  const rateEl=$("#f_commRate");
  const extraHint=document.getElementById("f_extraHint");
  const extraEl=$("#f_extraRate");
  if(hint)hint.textContent=r?("⚡ 自动识别："+(r.tag||(cat||"默认"))+" 平台扣点 "+r.rate+"%"):"⚡ 未匹配规则，可到“扣点规则”设置";

  if(apply&&prod&&r&&extraEl&&+r.extraRate>0)extraEl.value=r.extraRate;
  recalcOrder();
}

  const prodRows=Object.values(prodMap).map(r=>{const net=r.sale-r.refund-r.fees;const profit=net-r.cost;return {...r,net,profit,margin:r.sale?profit/r.sale*100:0};}).sort((a,b)=>b.sale-a.sale);

  return `<div class="topbar"><div class="t-left"><h2>📈 利润分析</h2><p>范围：${FILTER.label} · 按商品/平台/账号看真实盈亏</p></div>

  <tbody>${prodRows.length?prodRows.map(r=>`<tr><td style="font-weight:600">${esc(r.name)}</td><td style="color:var(--muted)">${esc(r.cat)}</td><td>${r.vol}</td><td>${yuan(r.sale)}</td><td>${yuan(r.cost)}</td><td>${yuan(r.fees)}</td><td style="color:var(--red)">${yuan(r.refund)}</td><td style="color:${r.profit>=0?"var(--green)":"var(--red)"};font-weight:700">${yuan(r.profit)}</td><td>${r.margin.toFixed(1)}%</td></tr>`).join(""):`<tr><td colspan="9" style="text-align:center;color:var(--muted)">该范围暂无销售</td></tr>`}</tbody></table></div>

function savePurchase(id){
  const prodId=$("#pu_prod").value;if(!prodId){toast("请选择商品","err");return;}
  const qty=+$("#pu_qty").value||0;const uc=+$("#pu_cost").value||0;
  if(qty<=0){toast("请填写有效数量","err");return;}
  if(uc<=0){toast("请填写采购单价","err");return;}
  const obj={productId:prodId,qty,unitCost:uc,supplier:$("#pu_supplier").value.trim(),note:$("#pu_note").value.trim(),date:$("#pu_date").value||new Date().toISOString().slice(0,10),planDue:($("#pu_planDue")?$("#pu_planDue").value:""),recvDate:($("#pu_recv")?$("#pu_recv").value:""),addr:($("#pu_addr")?$("#pu_addr").value.trim():""),taxRate:+(($("#pu_tax")||{}).value||0)||0,discount:+(($("#pu_disc")||{}).value||0)||0};
  if(id){const old=DB.purchases.find(x=>x.id===id);const op=DB.products.find(p=>p.id===old.productId);if(op)op.stock=Math.max(0,op.stock-old.qty);Object.assign(old,obj);}
  else{DB.purchases.push({id:pid(),...obj});}
  const prod=DB.products.find(p=>p.id===prodId);
  if(prod){prod.stock=(prod.stock||0)+qty;prod.cost=uc;}
  save();closeModal();render();toast(id?"进货已更新":"已入库，库存已增加");
}
function delPurchase(id){

  DB.purchases=DB.purchases.filter(y=>y.id!==id);save();render();toast("进货已删除，库存已扣回","warn");
}

function importData(){

  f.onchange=e=>{const file=e.target.files[0];if(!file)return;

      d.platforms=d.platforms||DEFAULT.platforms.map(p=>({...p}));d.accounts=d.accounts||[];d.products=d.products||[];d.orders=d.orders||[];d.expenses=d.expenses||[];

}

function renderCreditTbl(){

  <h3 class="sec"><span class="dot"></span>客户欠款</h3>
  <div class="table-wrap"><table><thead><tr><th>客户</th><th>销售</th><th>单数</th><th>应收</th><th>已收</th><th>未收</th><th>状态</th><th>操作</th></tr></thead><tbody>`;
  h+=rows.length?rows.map(r=>`<tr><td style="font-weight:600">${esc(r.name)}</td><td style="color:var(--muted)">${esc(Object.keys(r.sellers||{}).join("/")||"—")}</td><td>${r.orders}</td><td>${yuan(r.total)}</td><td style="color:var(--green)">${yuan(r.recv)}</td><td style="color:var(--red);font-weight:700">${yuan(r.remain)}</td><td>${r.remain<=0?"<span class=\"badge green\">已结清</span>":"<span class=\"badge red\">未结</span>"}</td><td><div class="table-actions"><button class="btn btn-primary btn-sm" onclick="collectCredit('${esc(r.name)}')">💰 收款</button><button class="btn btn-ghost btn-sm" onclick="settleCredit('${esc(r.name)}')">✅ 结清</button><button class="btn btn-ghost btn-sm" onclick="viewCreditCus('${esc(r.name)}')">📋 明细</button></div></td></tr>`).join(""):`<tr><td colspan="8" style="text-align:center;color:var(--muted)">暂无未结挂账</td></tr>`;
  h+=`</tbody></table></div>

function animate(){
  requestAnimationFrame(()=>{
    let toAnimate=[];
    // counts
    document.querySelectorAll(".count").forEach(el=>{
      const t=+el.dataset.target;const fmt=el.dataset.fmt||"num";
      animateCount(el,t,fmt==="money"?"money":"num");
    });
    // reveal
    const obs=new IntersectionObserver((ents)=>{
      ents.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}});
    },{threshold:.12});
    document.querySelectorAll(".reveal").forEach(el=>obs.observe(el));
    toAnimate.length=0;
  });
}

/* 连接 D 盘数据服务：启动时若 D 盘数据文件较新则恢复，并提示已接通 */
async function syncFromServer(){
  try{
    const r=await fetch(API+"/load",{cache:"no-store"});
    if(!r.ok){return;}
    const d=await r.json();
    // 服务可达即提示（无论是备份还是恢复）
    if(d&&d.orders){const remote=+d.savedAt||0,local=+DB.savedAt||0;
      if(remote>local){DB=d;save();render();toast("已从 D 盘数据文件恢复最新数据");}
      else{toast("已连接 D 盘数据服务，数据自动保存到 D 盘数据文件");}
    }else{
      toast("已连接 D 盘数据服务，数据自动保存到 D 盘数据文件");
    }
  }catch(e){/* 服务未启动时静默，自动使用本地缓存 */}
}

      <button class="btn btn-primary" style="width:100%;margin-top:14px;justify-content:center" onclick="doRegister()">📝 注册</button>
      <div id="rg_err" style="color:#f87171;font-size:12px;margin-top:10px"></div>
      <div style="margin-top:14px;font-size:13px;color:#8b93b8">已有账号？<a style="color:#22d3ee;cursor:pointer" onclick="showLog()">返回登录</a></div>
    </div>
    <p style="font-size:11px;color:#8b93b8;margin-top:14px">注册后默认“销售”角色，由管理员分配职位与平台账号。</p>`;
  ov.innerHTML=`<div style="width:100%;max-width:360px;text-align:center"><div style="width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#6c7bff,#22d3ee);display:grid;place-items:center;box-shadow:0 10px 30px rgba(108,123,255,.5)"><svg viewBox="0 0 48 48" width="34" height="34"><path d="M30 5c-6 4-6 12 1 13-7 1-12 6-14 12 4 4 10 5 15 2 7-4 10-11 8-17-1-5-5-8-7-7 0 0 1-4 4-6-3-1-5 0-7 3z" fill="#fff"/><path d="M9 8l6 22" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="43" cy="7" r="3" fill="#ffd166"/></svg></div>${body}</div>`;
  document.body.appendChild(ov);window._bootDone=done;
  try{var _r=JSON.parse(localStorage.getItem("honghuRemember")||"null");if(_r&&document.getElementById("lg_user")){document.getElementById("lg_user").value=_r.u||"";var _pw=document.getElementById("lg_pw");if(_pw)_pw.value=_r.p||"";var _rc=document.getElementById("lg_remember");if(_rc)_rc.checked=true;}}catch(e){}
  (setup?document.getElementById("su_user"):document.getElementById("lg_user")).focus();
}
function doLogin(){
  const u=document.getElementById("lg_user").value.trim();const p=document.getElementById("lg_pw").value;
  const us=DB.users.find(x=>x.username===u);
  if(us&&us.hash===hashPass(p,us.salt)){CUR=us;sessionStorage.setItem("honghuU",us.id);try{var _rm=document.getElementById("lg_remember");if(_rm&&_rm.checked){localStorage.setItem("honghuRemember",JSON.stringify({u:u,p:p}));}else{localStorage.removeItem("honghuRemember");}}catch(e){} const d=document.getElementById("loginOv");if(d)d.remove();if(window._bootDone){window._bootDone();window._bootDone=null;}}
  else{const e=document.getElementById("lg_err");if(e)e.textContent="用户名或密码错误";}
}
function showReg(){const lp=document.getElementById("loginPanel"),rp=document.getElementById("regPanel");if(lp)lp.style.display="none";if(rp)rp.style.display="";}
function showLog(){const lp=document.getElementById("loginPanel"),rp=document.getElementById("regPanel");if(lp)lp.style.display="";if(rp)rp.style.display="none";}
function doRegister(){
  const u=document.getElementById("rg_user").value.trim();const p1=document.getElementById("rg_pw1").value,p2=document.getElementById("rg_pw2").value;
  const err=x=>{const e=document.getElementById("rg_err");if(e)e.textContent=x;};
  if(!u){err("请填写用户名");return;}if(!p1||p1.length<4){err("密码至少 4 位");return;}if(p1!==p2){err("两次密码不一致");return;}
  if(DB.users.some(x=>x.username===u)){err("该用户名已被占用");return;}
  const salt=Math.random().toString(36).slice(2,8);
  const nu={id:pid(),username:u,salt,hash:hashPass(p1,salt),role:"sales",accountIds:[]};
  DB.users.push(nu);save();
  CUR=nu;sessionStorage.setItem("honghuU",nu.id);
  const d=document.getElementById("loginOv");if(d)d.remove();if(window._bootDone){window._bootDone();window._bootDone=null;}
}
function createAdmin(){
  const u=document.getElementById("su_user").value.trim(),p1=document.getElementById("su_pw1").value,p2=document.getElementById("su_pw2").value;
  const err=x=>{const e=document.getElementById("su_err");if(e)e.textContent=x;};
  if(!u){err("请填写用户名");return;}if(!p1||p1.length<4){err("密码至少 4 位");return;}if(p1!==p2){err("两次密码不一致");return;}
  const salt=Math.random().toString(36).slice(2,8);
  const nu={id:pid(),username:u,salt,hash:hashPass(p1,salt),role:"boss",accountIds:DB.accounts.filter(a=>canSee(a.id)).map(a=>a.id)};
  DB.users.push(nu);save();CUR=nu;sessionStorage.setItem("honghuU",nu.id);
  const d=document.getElementById("loginOv");if(d)d.remove();if(window._bootDone){window._bootDone();window._bootDone=null;}
}
async function boot(){
  try{const r=await fetch(API+"/load",{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&d.orders){const remote=+d.savedAt||0,local=+DB.savedAt||0;if(remote>local){DB=d;save();}}}}catch(e){}
  if(cloudEnabled()){try{const cd=await cloudLoad();if(cd&&cd.orders){const remote=+cd.savedAt||0,local=+DB.savedAt||0;if(remote>local){DB=cd;save();}}}catch(e){}}
  DB.users=DB.users||[];
  const lastU=sessionStorage.getItem("honghuU");CUR=DB.users.find(x=>x.id===lastU)||null;
  if(CUR){render();syncFromServer();}
  else{showLogin(()=>{render();syncFromServer();});}
}

/* ================= USER MANAGEMENT (管理员) ================= */
function vSecurity(){
  if(!isAdmin())return `<div class="topbar"><div class="t-left"><h2>🔐 安全设置</h2></div></div><div class="card" style="margin:20px 26px"><div class="empty"><div class="big">🔒</div><p>无权限查看</p></div></div>`;
  let html=`<div class="topbar"><div class="t-left"><h2>👥 用户管理</h2><p>创建/修改账号、设置角色，并给“销售”分配可管理的账号</p></div>
    <button class="btn btn-primary" onclick="openUserForm()">➕ 新增用户</button></div>
  <div class="table-wrap"><table><thead><tr><th>用户名</th><th>角色</th><th>权限范围</th><th>操作</th></tr></thead><tbody>`;
  html+=DB.users.map(u=>`<tr><td style="font-weight:600">${esc(u.username)}</td><td><span class="badge ${u.role==='sales'?'amber':'blue'}">${ROLE_NAME[u.role]||u.role}</span></td><td style="font-size:12px;color:var(--muted)">${u.role==='sales'?((u.accountIds||[]).map(id=>{const a=DB.accounts.find(x=>x.id===id);return a?esc(a.name):"—";}).join("、")||"未分配"):"全部账号"}</td>
   <td><div class="table-actions"><div class="icon-btn edit" onclick="openUserForm('${u.id}')">✏️</div><div class="icon-btn" style="color:var(--red)" onclick="delUser('${u.id}')">🗑️</div></div></td></tr>`).join("");
  html+=`</tbody></table></div><div class="card" style="margin:18px 26px"><div style="font-size:13px;line-height:1.9;color:var(--muted)">📌 角色：<b>老板/财务/主管</b> 看全部账号与全部功能；<b>销售</b> 只能看自己“持号”对应的数据，并能对其持号开单、对账、记费用。<br>首次使用请先创建管理员账号。</div></div>`;
  html+='<div class="card" style="margin:18px 26px"><h4 style="margin-bottom:8px">💾 数据备份 / 恢复</h4>'
   +'<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">定期备份可防意外丢失；换电脑时用它把数据整体搬过去。恢复会<b>覆盖</b>当前全部数据。</div>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
   +'<button class="btn btn-primary" onclick="backupAll()">⬇️ 导出全部数据（备份文件）</button>'
   +'<label class="btn btn-ghost" style="cursor:pointer;margin:0">⬆️ 从备份恢复<input type="file" accept=".json,application/json" style="display:none" onchange="restoreAll(this)"></label>'
   +'</div></div>';
  html+='<div class="card" style="margin:18px 26px"><h4 style="margin-bottom:8px">📝 操作日志（最近 200 条）</h4>'
   +'<div style="margin-bottom:8px"><button class="btn btn-ghost btn-sm" onclick="exportCsv((DB.logs||[]).slice(-500).map(function(l){return {时间:String(l.t||"").replace("T"," ").slice(0,19),操作人:l.u||"",动作:l.a||"",详情:l.d||""};}),\'操作日志.csv\')">⬇️ 导出日志</button></div>'
   +'<div class="table-wrap" style="padding:0"><table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>详情</th></tr></thead><tbody>'
   +((DB.logs||[]).slice(-200).reverse().map(function(l){return '<tr><td style="white-space:nowrap;font-size:12px">'+esc(String(l.t||"").replace("T"," ").slice(0,19))+'</td><td>'+esc(l.u||"—")+'</td><td style="font-weight:600">'+esc(l.a||"")+'</td><td style="font-size:12px;color:var(--muted)">'+esc(l.d||"")+'</td></tr>';}).join("")||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">暂无日志</td></tr>')
   +'</tbody></table></div></div>';
  html+=cloudCardHtml();
  return html;
}
function backupAll(){
  try{
    const data=JSON.stringify({app:'鸿鹄对账软件',ver:'v9-12a',ts:new Date().toISOString(),db:DB});
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='鸿鹄对账备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){try{URL.revokeObjectURL(url);a.remove();}catch(e){}},600);
    logAct("导出备份","");toast('已导出备份文件');
  }catch(e){toast('导出失败：'+e.message,'err');}
}
function restoreAll(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const j=JSON.parse(r.result);
      const d=(j&&j.db)?j.db:j;
      if(!d||typeof d!=='object'||(!d.products&&!d.orders&&!d.users)){toast('文件格式不对（不是本软件的备份）','err');return;}
      if(!confirm('确定用这个备份【覆盖】当前全部数据？建议先导出一次当前数据。'))return;
      logAct("恢复备份",(j&&j.ts)||"");DB=d;save();closeModal();render();toast('✅ 已从备份恢复');
    }catch(e){toast('恢复失败：'+e.message,'err');}
  };
  r.readAsText(f);inp.value='';
}
function openUserForm(id){
  const roles=[["boss","老板"],["finance","财务"],["super","主管"],["ssup","销售主管"],["sales","销售"]];
  const roleOpts=r=>roles.map(x=>`<option value="${x[0]}" ${r===x[0]?"selected":""}>${x[1]}</option>`).join("");
  const accChecks=sel=>{if(!DB.accounts.length)return `<div style="font-size:12px;color:var(--muted)">暂无平台账号，请先到「平台与账号」添加账号。</div>`;return DB.accounts.filter(a=>canSee(a.id)).map(a=>`<label style="font-size:12.5px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:6px"><input type="checkbox" value="${a.id}" ${sel.includes(a.id)?"checked":""}> ${esc(a.name)}</label>`).join("");}
  const idv=id?DB.users.find(x=>x.id===id):{role:"sales",accountIds:[]};
  openModal(`<div class="modal-head"><h3>${id?'✏️ 编辑用户':'➕ 新增用户'}</h3><div class="icon-btn" onclick="closeModal()">✖️</div></div><div class="modal-body">
      <div class="field"><label class="req">用户名</label><input id="u_name" value="${id?esc(idv.username):""}" placeholder="如：小王"></div>
      <div class="field"><label>${id?"重置密码（留空不改）":"密码（至少4位）"}</label><input id="u_pw" type="password" placeholder="${id?'若修改请填写':'至少 4 位'}"></div>
      <div class="field"><label class="req">角色</label><select id="u_role" onchange="roleAccToggle()">${roleOpts(idv.role)}</select></div>
      <div class="field"><label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="u_debt" ${idv.debt?"checked":""}> 允许查看「借还款」（老板授权）</label></div>
      <div class="field" id="u_acc"><label>她/他管理的账号（销售 / 销售主管专用）</label><div style="display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto">${accChecks(idv.accountIds||[])}</div></div>
      </div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveUser('${id||""}')">保存</button></div>`);
  roleAccToggle();
}
function roleAccToggle(){const r=$("#u_role").value;const box=$("#u_acc");if(box)box.style.display=(r==="sales"||r==="ssup")?"":"none";}
function saveUser(id){
  const name=$("#u_name").value.trim();if(!name){toast("请填写用户名","err");return;}
  const role=$("#u_role").value;
  const accs=[...document.querySelectorAll("#u_acc input[type=checkbox]:checked")].map(c=>c.value);
  const debtOk=!!(document.getElementById("u_debt")&&document.getElementById("u_debt").checked);
  const pw=$("#u_pw").value;
  if(id){const u=DB.users.find(x=>x.id===id);u.username=name;u.role=role;u.accountIds=accs;u.debt=debtOk;if(pw){const salt=Math.random().toString(36).slice(2,8);u.salt=salt;u.hash=hashPass(pw,salt);}toast("用户已更新");}
  else{if(pw.length<4){toast("密码至少 4 位","err");return;}const salt=Math.random().toString(36).slice(2,8);DB.users.push({id:pid(),username:name,salt,hash:hashPass(pw,salt),role,accountIds:accs,debt:debtOk});toast("用户已创建");}
  save();closeModal();render();
}
function delUser(id){if(!confirm("确定删除该用户？"))return;if(DB.users.length<=1){toast("至少保留一个管理员账号","warn");return;}DB.users=DB.users.filter(x=>x.id!==id);save();render();toast("用户已删除","warn");}
function logout(){CUR=null;sessionStorage.removeItem("honghuU");location.reload();}

/* boot */
try{ if('serviceWorker' in navigator){ if(location.hostname==='localhost'||location.hostname==='127.0.0.1'){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){try{r.unregister();}catch(e){}});}); } else { var _reg=null,_rl=false; navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){ _reg=reg; try{reg.update();}catch(e){} reg.addEventListener('updatefound',function(){ var nw=reg.installing; if(!nw)return; nw.addEventListener('statechange',function(){ if(nw.state==='installed'){ try{nw.postMessage('SKIP_WAITING');}catch(e){} if(navigator.serviceWorker.controller){ try{location.reload();}catch(e){} } } }); }); }).catch(function(){}); navigator.serviceWorker.addEventListener('controllerchange',function(){ if(_rl)return; _rl=true; try{location.reload();}catch(e){} }); setInterval(function(){ try{if(_reg)_reg.update();}catch(e){} },120000); document.addEventListener('visibilitychange',function(){ if(!document.hidden){ try{if(_reg)_reg.update();}catch(e){} } }); } } }catch(e){}
function mobileCardify(){try{if(window.innerWidth>=760)return;document.querySelectorAll("#view table,#modal table").forEach(function(t){if(t.getAttribute("data-cardified")==="1")return;var ths=[].slice.call(t.querySelectorAll("thead th")).map(function(th){return (th.textContent||"").trim().replace(/\s+/g," ");});[].slice.call(t.querySelectorAll("tbody tr")).forEach(function(tr){[].slice.call(tr.children).forEach(function(td,i){td.setAttribute("data-l",ths[i]||"");});});t.setAttribute("data-cardified","1");});}catch(e){}}
var _moT=null;
try{var _mo=new MutationObserver(function(){if(_moT)clearTimeout(_moT);_moT=setTimeout(mobileCardify,60);});var _v=document.getElementById("view"),_m=document.getElementById("modal");if(_v)_mo.observe(_v,{childList:true,subtree:true});if(_m)_mo.observe(_m,{childList:true,subtree:true});}catch(e){}
boot();

</script>
